# Shared commit gate for repos outside the JS toolchain (Python, Nix, docs).
# Pull it in from the consumer's lefthook.yml:
#
#   remotes:
#     - git_url: https://github.com/nodeve-com/nodeve
#       ref: main
#       configs:
#         - hooks/lefthook.yml
#
# Refresh after nodeve changes with `lefthook install` (it refetches remotes).
pre-commit:
  jobs:
    # Format staged markdown and re-stage it, before anything measures it. md-fmt
    # and md-lint ship in nodeve's flake (packages.md-tools); nix-config installs
    # them on dev machines.
    - name: md-fmt
      glob: '*.md'
      run: |
        command -v md-fmt >/dev/null || { echo "✖ md-fmt: not on PATH (nodeve flake packages.md-tools; nix-config infra.dev installs it)"; exit 1; }
        md-fmt {staged_files}
      stage_fixed: true

    # Lint staged markdown: broken relative links and headings, structure.
    - name: md-lint
      glob: '*.md'
      run: md-lint {staged_files}

    # Prose: vale with the org rules from @nodeve/checks; an error alert fails.
    - name: md-prose
      glob: '*.md'
      run: md-prose {staged_files}

    # Format staged shell scripts and re-stage them; sh-fmt and sh-lint ship in
    # nodeve's flake (packages.sh-tools).
    - name: sh-fmt
      glob: '*.{sh,bash}'
      run: |
        command -v sh-fmt >/dev/null || { echo "✖ sh-fmt: not on PATH (nodeve flake packages.sh-tools)"; exit 1; }
        sh-fmt {staged_files}
      stage_fixed: true

    - name: sh-lint
      glob: '*.{sh,bash}'
      run: sh-lint {staged_files}

    # Staged markdown under the org doc budget — see .lefthook/pre-commit/doc-size.sh.
    - script: doc-size.sh
      runner: bash

    # Staged source files under the org line budget (300 fail, 225 warn) — see
    # .lefthook/pre-commit/file-size.sh.
    - script: file-size.sh
      runner: bash

    # No block of code repeated across files. jscpd v5 is the Rust build, fetched
    # once by pnpx. What it scans (formats, paths, ignores) is the repo's own
    # .jscpd.json; a repo without one fails rather than going unchecked.
    - name: clones
      run: |
        [ -f .jscpd.json ] || { echo "✖ clones: add a .jscpd.json (formats, path, ignore) — see victron's"; exit 1; }
        pnpx jscpd@5.3.3 --config .jscpd.json --silent || { pnpx jscpd@5.3.3 --config .jscpd.json --reporters console 2>&1 | grep -v '^Progress'; exit 1; }
