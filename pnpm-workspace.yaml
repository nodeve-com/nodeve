packages:
  - 'packages/*'

# esbuild (via vitest) ships a postinstall; allow it to build its native binary.
allowBuilds:
  esbuild: true

# Single source of every third-party version — workspace packages reference these
# via the `catalog:` protocol, never a literal pin (enforced by nodeve-check-catalog).
# Peer ranges in @nodeve/config resolve from here too, so the published floor tracks
# what nodeve itself builds against.
catalog:
  '@ast-grep/napi': ^0.44.1
  '@changesets/cli': ^2.27.0
  '@eslint/compat': ^2.1.0
  '@eslint/js': ^10.0.1
  '@noble/hashes': ^2.0.0
  '@scure/base': ^2.0.0
  '@sinclair/typebox': ^0.34.50
  '@types/node': ^24.0.0
  '@types/pluralize': ^0.0.33
  '@vitest/browser-playwright': ^4.1.9
  ajv: ^8.20.0
  ajv-formats: ^3.0.1
  date-fns: ^4.0.0
  eslint: ^10.7.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-svelte: ^3.19.0
  globals: ^17.7.0
  js-tiktoken: ^1.0.0
  jscpd: ^5.0.0
  pluralize: ^8.0.0
  prettier: ^3.9.5
  prettier-plugin-svelte: ^3.5.1
  prettier-plugin-tailwindcss: ^0.7.2
  remeda: ^2.0.0
  remeda-humps: ^4.1.0
  ts-morph: ^28.0.0
  typescript: ^6.0.3
  typescript-eslint: ^8.63.0
  vitest: ^3.0.0
  yaml: ^2.9.0

# TS 7 (native) drives the `check`/typecheck path per package — ~10x faster, and
# a package's `tsc --noEmit` needs no eslint. The default `catalog.typescript`
# stays 6.x because typescript-eslint's parser (root eslint) still peer-caps
# `<6.1.0`. Packages that are ONLY type-checked reference `catalog:ts7`.
# A package that IMPORTS the `typescript`/`ts-morph` compiler API at runtime
# (e.g. @nodeve/checks) MUST stay on `catalog:` (6.x): TS 7's native package does
# not ship that JS API surface — same wall ts-eslint hits. eslint/root stays 6.x.
catalogs:
  ts7:
    typescript: 7.0.2

# A TS7-on-check package leaves @nodeve/config's `typescript: ^6.0.3` peer
# unsatisfied — cosmetic (the peer feeds ts-eslint's parser, which the package
# doesn't run). Silence the warning rather than let it bury real ones.
peerDependencyRules:
  allowedVersions:
    typescript: '7'
