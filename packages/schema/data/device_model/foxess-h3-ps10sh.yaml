# Categorical observables of the WHOLE box — a run mode or fault set aggregates
# across PV, grid, BMS and temperature, so no sub-feature owns them; their
# feature-of-interest is the model root. Enum-valued, not VIM-ranged, so they
# carry no quantity kind.
#
# Reported as a SET — EVERY set bit across the group, not collapsed to one. Bits
# stay in the group the device puts them in: the word1-bit6 fault flag is reported
# under run-state, where it physically lives, not relocated onto fault-code.
#
# Each word pairs its address with its own bit labels; list position IS the bit
# number, `null` a bit not yet identified.
decode:
  run-state:
    kind: flags
    empty: unknown
    join: '; '
    word:
      - address: 39063
        label: [standby, null, on-grid, null, null, null, fault]
      - address: 39064
        label: [] # read as part of the group; its bits aren't identified yet
      - address: 39065
        label: [off-grid]
  fault-code:
    kind: flags
    empty: none
    join: '; '
    word:
      - address: 39067
        label:
          - fault-pv-voltage-over
          - fault-dc-arc
          - fault-pv-string-connection-reverse
          - null
          - null
          - null
          - null
          - fault-grid-lost
          - fault-grid-voltage
          - null
          - null
          - fault-grid-frequency
          - null
          - null
          - fault-output-current-over
          - fault-output-dc-current-over
      - address: 39068
        label:
          - fault-residual-current-consistency
          - fault-ground-connection
          - fault-insulation-resistance-low
          - fault-inverter-temperature-over
          - null
          - null
          - null
          - null
          - null
          - fault-energy-storage-equipment-abnormal
          - fault-island-isolated
          - null
          - null
          - null
          - fault-off-grid-output-overload
          - null
      - address: 39069
        label:
          - null
          - null
          - null
          - fault-fan-external
          - fault-energy-storage-connection-reverse
          - null
          - null
          - null
          - null
          - fault-meter-lost
          - fault-bms-lost
