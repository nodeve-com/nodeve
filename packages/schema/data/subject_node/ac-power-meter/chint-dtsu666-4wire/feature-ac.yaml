feature_of_interest:
  ac-phase:
    # ONE three-phase point. `_` carries the whole-point totals; the legs
    # (a/b/c) and the line-to-line pairs (ab/bc/ca) are its parts. Both banks
    # feed this point — bank A and bank B map the same measurands, so two
    # registers share one `_` interval (differing only in scale/decimals).
    point:
      $: { part_set: three-phase }
      # Whole-point totals — frequency, the power totals, and the energy
      # accumulators. No `*` default: each part states its own measurands via
      # the anchors below, so the line pairs never inherit leg-only channels.
      _:
        # Rated band + the readable span, told apart by whether it carries a
        # specification (behavioural) or a measurement (measurable channel).
        frequency:
          continuous:
            valued_range: { min: 45, max: 65 }
            specification: { rating: continuous }
          _: { valued_range: { min: 45, max: 65 }, measurement: { resolution: 0.01 } }
        # Whole-point totals — no rated band stated; just the measurable link.
        active-power: { _: { measurement: {} } }
        reactive-power: { _: { measurement: {} } }
        apparent-power: { _: { measurement: {} } }
        power-factor: { _: { measurement: {} } }
        # Slow-window accumulators (0x1000) — three distinct quantity kinds, one
        # combined channel each. scale 1.0 + decimals provisional (uncalibrated).
        active-energy: { _: { measurement: {} } }
        apparent-energy: { _: { measurement: {} } }
        reactive-energy: { _: { measurement: {} } }
      # Per-leg (a/b/c) measurands — one authored block, aliased to each leg.
      a: &leg
        voltage:
          # 220/230 are a commissioning choice, not two simultaneous limits:
          # each gates on the single-valued grid-region setting.
          nominal-br-220v-60hz:
            valued_range: { value: 220, margin_lower: 0.3, margin_upper: 0.2 }
            specification:
              rating: continuous
              severity: nominal
              conditions: [ { setting: grid-region, equals: br-220v-60hz } ]
          nominal-eu-230v-50hz:
            valued_range: { value: 230 }
            specification:
              severity: nominal
              conditions: [ { setting: grid-region, equals: eu-230v-50hz } ]
          _: { valued_range: { min: 150, max: 280 }, measurement: {} }
        electric-current: { _: { measurement: {} } }
        active-power: { _: { measurement: {} } }
        reactive-power: { _: { measurement: {} } }
        apparent-power: { _: { measurement: {} } }
        power-factor: { _: { measurement: {} } }
        # Fundamental displacement angle φ (bank B), degrees — resolves ~0.1°.
        phase-difference: { _: { measurement: { resolution: 0.1 } } }
      b: *leg
      c: *leg
      # Line-to-line voltages (ab/bc/ca). Nominal = √3 × the leg nominal —
      # 380 V (br 3×220) / 400 V (eu 3×230), gated on the same grid-region.
      ab: &line
        voltage:
          nominal-br-220v-60hz:
            valued_range: { value: 380 }
            specification:
              severity: nominal
              conditions: [ { setting: grid-region, equals: br-220v-60hz } ]
          nominal-eu-230v-50hz:
            valued_range: { value: 400 }
            specification:
              severity: nominal
              conditions: [ { setting: grid-region, equals: eu-230v-50hz } ]
          _: { valued_range: { min: 260, max: 480 }, measurement: {} }
      bc: *line
      ca: *line
