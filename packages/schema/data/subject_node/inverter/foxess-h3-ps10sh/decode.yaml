# The one SKU here — a box, not a family. Its family answers Inv.H3_SMART
# (model.yaml), so it inherits through foxess-h3-smart → foxess-inverter and
# states no coordinate of its own: the H3 Smart reads the catalog's 36001 and
# decodes all three parts BCD, which is the bare case.
archetype: foxess-h3-smart

# Categorical channels of the WHOLE box — a run mode / fault set aggregates
# across PV, grid, BMS, temp; no sub-feature owns them. Enum-valued, not
# VIM-ranged: no quantity_kind, no interval. Their members mint from the flag
# labels the catalog carries, verbatim as FoxESS spells them.
channel:
  # inverter_state words 1 and 3 — standby / on-grid / fault, off-grid
  run-state: { empty: unknown }
  # inverter_fault_code words 1–3
  fault-code: { empty: none }

# Where a register lands is the register's own `target`, on data/pdu_catalog/foxess:
# a FoxESS address reads the same port on every box carrying it, so it is the
# publisher's fact, stated once.
#
# NOT read: 39064 (inverter_state word 2) — the upstream state sensor reads words
# 1 and 3 only, so no row of the catalog sits at that address.
