network_interface:
  wlan0: { interface_type: ieee80211 }
  eth0: { interface_type: ethernet_csmacd, link_speed: 100 }

# Services this box OFFERS — the network surfaces a consumer reaches. Each binds
# to a NIC above; the site overlay fills that NIC's address.
#
# The modbus-tcp surface names WHAT it speaks: FoxESS's dictionary. It states no
# start, so this port reads the catalog's — the same the RS-485 port reads
# (link.yaml), which is why the two carry identical data. On an H1 they would
# not: that box reads input registers on serial and holding on LAN.
service_binding:
  modbus-tcp:
    service_protocol: modbus_tcp
    network_interface: eth0
    port: 502
    pdu_catalog: foxess
    unit_id: 247 # H3 AUX default; overridable downstream
  web-ui: { service_protocol: https, network_interface: eth0, port: 443 }
