# Moisture output as a volume flow (QUDT VolumeFlowRate); L/day is a non-SI
# override (canonical m³/s). Partless — whole-unit rated water extraction.
feature_of_interest:
  moisture-removal:
    output:
      _:
        volume-flow-rate:
          nominal:
            valued_range: { value: 30, unit: L/day }
            specification: { severity: nominal }
