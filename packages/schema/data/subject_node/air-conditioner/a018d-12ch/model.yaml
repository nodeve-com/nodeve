content:
  en:
    title: Equation A018D-12CH
    lede: Reversible split air conditioner
    body: >
      Equation A018D-12CH — R290 reversible (cooling + heating) split air conditioner. Its datasheet gives a rated cooling output (thermal power, 9000 BTU/h ≈ 2638 W) and the single-phase AC supply it draws on: accepted 220–240 V / 50 Hz plus its rated input draw in each running mode — cooling 1391 W, heating 1346 W. The AC connection is the appliance's, not the compressor's.
