# Mini-Box M4-ATX — intelligent DC-DC ATX power supply. PARTIAL port from
# grimoire/concepts/catalog/mini-box/m4_atx.yaml: the electrical FEATURE tree
# only (DC input + ignition sense + the 12/5/3.3 V ATX output rails + board
# temperature). How it is READ/WRITTEN — the usbhid diag poll and the 47-param
