# Victron SmartSolar MPPT 100/30 — one catalog entry: identity (the
# charge-controller node_type) and where the VE.Direct keys land (service.yaml).
# The field list itself is Victron's, in data/pdu_catalog/ve-direct.
product: { model: SmartSolar MPPT 100/30, organization: victron }

content:
  en:
    title: Victron SmartSolar MPPT 100/30
    lede: DC solar MPPT charge controller (VE.Direct)
    body: >
      Victron SmartSolar MPPT 100/30 — a single-tracker DC solar MPPT charge controller, read over VE.Direct. It authors no decode rows: the keys, their types and their quantities are Victron's, in the ve-direct PDU catalog every Victron device references. What this entry adds is the port and four bindings — V/I → the battery DC-output port, VPV/PPV → the single pv-tracker input, ordinal 1. Every other key of the catalog (CS/MPPT/ERR codes, the H19–H23 yield counters) is read and published under its own key until a feature type lands to hold it.


      The reported product id is 0xA07D (captured live, serial HQ2241V4RXC) — per Victron's PID list, the SmartSolar MPPT 100/30 rev2; a driver may use the PID field to verify a stream's identity.
