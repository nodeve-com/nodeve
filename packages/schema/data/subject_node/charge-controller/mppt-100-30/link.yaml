# What this box OFFERS: a VE.Direct header. Nothing dials it — it pushes. Neither
# the level nor the rate is here: the protocol permits 3v3 and 5v and the port
# adapts to whichever it is wired to, and 19200 8N1 is VE.Direct's, in
# data/link_protocol. The decode contract is Victron's too, named here and
# authored in data/pdu_catalog/ve-direct; where its keys land is the device's,
# in decode.yaml.
link_binding: { ve-direct: { link_protocol: ve-direct, pdu_catalog: ve-direct } }
