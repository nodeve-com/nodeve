# AC power meter — one AC point. The connection's phase count is the model's own
# (part_set: three-phase / split-phase); the type stays phase-agnostic.
facet:
  product: { cardinality: single, required: true }
  register_map: { cardinality: reference } # shared family map → NodeEdge
  point:
    facet: feature_of_interest
    cardinality: child
    feature_type: ac-phase
    required: true
