# A PV array — the installed grouping of series strings. The `string` socket
# carries the array's DC bands, whose PART key is the string's ordinal: the
# module each string repeats is that part's `device`, and its plane, series
# count and any fitted value (a measured effective Voc) are intervals on it. A
# string stating no band falls back to module spec × its count interval.
facet:
  location: { cardinality: single }
  string: { facet: feature_of_interest, cardinality: child, feature_type: dc-port }
