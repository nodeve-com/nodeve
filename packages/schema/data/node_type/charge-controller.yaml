# DC solar MPPT charge controller (Victron SmartSolar / BlueSolar family).
# Identity + the VE.Direct header it offers + its DC feature blocks (pv-tracker
# input, battery output). It authors no decode rows: the field set is Victron's,
# named by the link binding (data/pdu_catalog/ve-direct).
facet:
  product: { cardinality: single, required: true }
  link_binding: { cardinality: child }
  pv-tracker:
    facet: feature_of_interest
    cardinality: child
    feature_type: dc-port
    required: true
  battery: { facet: feature_of_interest, cardinality: child, feature_type: dc-port }
