# Air conditioner — a vapor-compression appliance whose defining feature is
# rated cooling output: an AC supply it draws on, the thermal power it moves,
# and the refrigerant its circuit charges. Pure spec, no register map (read
# through whatever meters its supply, not directly).
facet:
  product: { cardinality: single, required: true }
  refrigeration: { cardinality: single }
  supply: { facet: feature_of_interest, cardinality: child, feature_type: ac-phase }
  output:
    facet: feature_of_interest
    cardinality: child
    feature_type: cooling
    required: true
