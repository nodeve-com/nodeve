# Compressor dehumidifier — a vapor-compression appliance: an AC supply it
# draws on, the moisture it extracts, and the refrigerant its circuit charges.
# Pure spec, no register map (read through whatever meters its supply, not
# directly).
facet:
  product: { cardinality: single, required: true }
  refrigeration: { cardinality: single }
  supply: { facet: feature_of_interest, cardinality: child, feature_type: ac-phase }
  output:
    facet: feature_of_interest
    cardinality: child
    feature_type: moisture-removal
    required: true
