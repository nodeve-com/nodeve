# DC-DC ATX power supply (Mini-Box M4-ATX family) — a DC input converted to
# the ATX output rails, plus a board thermal sensor. How it is READ/WRITTEN
# (usbhid diag + config plane) is device-owned data, ported later; this class
# is its electrical FEATURE tree only.
facet:
  product: { cardinality: single, required: true }
  setting: { cardinality: child }
  input: { facet: feature_of_interest, cardinality: child, feature_type: dc-port, required: true }
  ignition: { facet: feature_of_interest, cardinality: child, feature_type: dc-port }
  # ONE output connector; the rails are its role-parts (part_set: atx), not
  # sibling sockets — they share one wattage budget the whole (`_`) carries.
  out: { facet: feature_of_interest, cardinality: child, feature_type: dc-port, required: true }
  enclosure: { facet: feature_of_interest, cardinality: child, feature_type: environment }
