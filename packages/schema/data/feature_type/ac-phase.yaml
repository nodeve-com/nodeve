# Definition registry rows — authored ONCE, shared by every catalog entry.
# No parts here: a/b/c vs l1/l2 is a per-MODEL fact, so parts are rows on the
# feature, not the type. This row says only which quantities an AC port carries.
# Validates with: linkml-validate -s ../../linkml/nodeve.yaml -C FeatureType ac-phase.yaml
node: node:feature-type/ac-phase
slug: ac-phase
# one row per quantity — the overlay's AcQuantity enum is the union of these;
# aspect flags (which width extension a quantity's rows may carry) = bake check
quantity_bindings:
  - { node: node:feature-type/ac-phase/voltage, quantity_kind: node:quantity-kind/voltage, spec: true, measurable: true }
  - { node: node:feature-type/ac-phase/electric-current, quantity_kind: node:quantity-kind/electric-current, spec: true, measurable: true }
  - { node: node:feature-type/ac-phase/frequency, quantity_kind: node:quantity-kind/frequency, spec: true, measurable: true }
  - { node: node:feature-type/ac-phase/active-power, quantity_kind: node:quantity-kind/active-power, spec: true, measurable: true }
  - { node: node:feature-type/ac-phase/apparent-power, quantity_kind: node:quantity-kind/apparent-power, spec: true, measurable: true }
  - { node: node:feature-type/ac-phase/reactive-power, quantity_kind: node:quantity-kind/reactive-power, measurable: true }
  - { node: node:feature-type/ac-phase/active-energy, quantity_kind: node:quantity-kind/active-energy, measurable: true }
