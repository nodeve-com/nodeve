# Chint DTSU666. All three maps answer at once; which a reader takes is its own.
#
# ABSENT: 0x2000 energy totals, the 0x4000 quadrants, the 0x1000 energy
# quadrants, neutral current. No import/export split — a derivation, not a field.
publisher: chint
register_type: holding
word_order: high_first
datatype: float32 # every field of every PDU here
target: { feature_type: ac-phase, role: point } # one socket; a field names its part

pdu:
  - slug: chint-1000
    content:
      en:
        title: Energy accumulators
        lede: Three quantity kinds, one combined accumulator each — scale provisional (uncalibrated)
    start: 4096
    field:
      - address: 4096
        transform: { decimals: 2, unit: kWh }
        target: { part: _, quantity_kind: active-energy }
      - address: 4106
        transform: { decimals: 2, unit: kVAh }
        target: { part: _, quantity_kind: apparent-energy }
      - address: 4144
        transform: { unit: kvarh }
        target: { part: _, quantity_kind: reactive-energy }

  - slug: chint-1510
    content:
      en:
        title: Engineering units
        lede: Most fields carry only the decimals the sensor resolves; power is native kW/kvar/kVA — non-SI, so the unit is stated
    start: 5392
    field:
      # Phase-neutral voltages (0x1510/12/14)
      - address: 5392
        transform: &d3 { decimals: 3 }
        target: { part: a, quantity_kind: voltage }
      - { address: 5394, transform: *d3, target: { part: b, quantity_kind: voltage } }
      - { address: 5396, transform: *d3, target: { part: c, quantity_kind: voltage } }
      # Phase currents (0x1516/18/1A)
      - address: 5398
        transform: *d3
        target: { part: a, quantity_kind: electric-current }
      - { address: 5400, transform: *d3, target: { part: b, quantity_kind: electric-current } }
      - { address: 5402, transform: *d3, target: { part: c, quantity_kind: electric-current } }
      # Active power (0x151C/1E/20/22)
      - address: 5404
        transform: &kw { decimals: 3, unit: kW }
        target: { part: _, quantity_kind: active-power }
      - { address: 5406, transform: *kw, target: { part: a, quantity_kind: active-power } }
      - { address: 5408, transform: *kw, target: { part: b, quantity_kind: active-power } }
      - { address: 5410, transform: *kw, target: { part: c, quantity_kind: active-power } }
      # Reactive power (0x1524/26/28/2A)
      - address: 5412
        transform: &kvar { decimals: 3, unit: kvar }
        target: { part: _, quantity_kind: reactive-power }
      - { address: 5414, transform: *kvar, target: { part: a, quantity_kind: reactive-power } }
      - { address: 5416, transform: *kvar, target: { part: b, quantity_kind: reactive-power } }
      - { address: 5418, transform: *kvar, target: { part: c, quantity_kind: reactive-power } }
      # Apparent power (0x152C/2E/30/32)
      - address: 5420
        transform: &kva { decimals: 3, unit: kVA }
        target: { part: _, quantity_kind: apparent-power }
      - { address: 5422, transform: *kva, target: { part: a, quantity_kind: apparent-power } }
      - { address: 5424, transform: *kva, target: { part: b, quantity_kind: apparent-power } }
      - { address: 5426, transform: *kva, target: { part: c, quantity_kind: apparent-power } }
      # Power factor (0x1534/36/38/3A) — TRUE PF (P/S, harmonics included)
      - address: 5428
        transform: *d3
        target: { part: _, quantity_kind: power-factor }
      - { address: 5430, transform: *d3, target: { part: a, quantity_kind: power-factor } }
      - { address: 5432, transform: *d3, target: { part: b, quantity_kind: power-factor } }
      - { address: 5434, transform: *d3, target: { part: c, quantity_kind: power-factor } }
      # Displacement angle φ (0x153C/3E/40) — the FUNDAMENTAL cosφ₁, not acos(PF)
      - address: 5436
        transform: &deg { decimals: 1, unit: deg }
        target: { part: a, quantity_kind: phase-difference }
      - { address: 5438, transform: *deg, target: { part: b, quantity_kind: phase-difference } }
      - { address: 5440, transform: *deg, target: { part: c, quantity_kind: phase-difference } }
      # System frequency (0x154E)
      - address: 5454
        transform: { decimals: 2 }
        target: { part: _, quantity_kind: frequency }

  - slug: chint-2000
    content:
      en:
        title: Divisor-scaled floats
        lede: V ÷10, A ÷1000, power ÷10, PF ÷1000, Hz ÷100; power is native W/var, so SI — no unit override
    start: 8192
    field:
      # Line-to-line voltages (0x2000/02/04)
      - address: 8192
        transform: &tenth { scale: 0.1, decimals: 1 }
        target: { part: ab, quantity_kind: voltage }
      - { address: 8194, transform: *tenth, target: { part: bc, quantity_kind: voltage } }
      - { address: 8196, transform: *tenth, target: { part: ca, quantity_kind: voltage } }
      # Phase-neutral voltages (0x2006/08/0A)
      - address: 8198
        transform: *tenth
        target: { part: a, quantity_kind: voltage }
      - { address: 8200, transform: *tenth, target: { part: b, quantity_kind: voltage } }
      - { address: 8202, transform: *tenth, target: { part: c, quantity_kind: voltage } }
      # Phase currents (0x200C/0E/10)
      - address: 8204
        transform: &milli { scale: 0.001, decimals: 3 }
        target: { part: a, quantity_kind: electric-current }
      - { address: 8206, transform: *milli, target: { part: b, quantity_kind: electric-current } }
      - { address: 8208, transform: *milli, target: { part: c, quantity_kind: electric-current } }
      # Active power (0x2012 total, 0x2014/16/18 per phase)
      - address: 8210
        transform: *tenth
        target: { part: _, quantity_kind: active-power }
      - { address: 8212, transform: *tenth, target: { part: a, quantity_kind: active-power } }
      - { address: 8214, transform: *tenth, target: { part: b, quantity_kind: active-power } }
      - { address: 8216, transform: *tenth, target: { part: c, quantity_kind: active-power } }
      # Reactive power (0x201A total, 0x201C/1E/20 per phase)
      - address: 8218
        transform: *tenth
        target: { part: _, quantity_kind: reactive-power }
      - { address: 8220, transform: *tenth, target: { part: a, quantity_kind: reactive-power } }
      - { address: 8222, transform: *tenth, target: { part: b, quantity_kind: reactive-power } }
      - { address: 8224, transform: *tenth, target: { part: c, quantity_kind: reactive-power } }
      # Power factor (0x202A total, 0x202C/2E/30 per phase)
      - address: 8234
        transform: *milli
        target: { part: _, quantity_kind: power-factor }
      - { address: 8236, transform: *milli, target: { part: a, quantity_kind: power-factor } }
      - { address: 8238, transform: *milli, target: { part: b, quantity_kind: power-factor } }
      - { address: 8240, transform: *milli, target: { part: c, quantity_kind: power-factor } }
      # System frequency (0x2044)
      - address: 8260
        transform: { scale: 0.01, decimals: 2 }
        target: { part: _, quantity_kind: frequency }
