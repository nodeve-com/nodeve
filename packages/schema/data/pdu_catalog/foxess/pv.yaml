# Two tracker layouts. Each repeats ONE per-tracker sequence, so each is that
# sequence with a placement per tracker — the tracker number is a target
# coordinate, so `part` rides the placement beside `start`.
#
# What forks between them is the field set: 31000 interleaves power with each
# tracker's voltage and current, 39070 does not — that generation answers power
# in a run of its own. Current scale moves too, and rides the pdu.
#
# The state and fault words sharing 39063's address run are a different
# sequence and are named separately; a family that reads one need not read all.
pdu:
  - slug: pv-tracker
    content: { en: { title: PV tracker } }
    datatype: int16
    placement:
      - { start: 11000, part: 1, register_type: input }
      - { start: 11003, part: 2, register_type: input }
      - { start: 31000, part: 1 }
      - { start: 31003, part: 2 }
    field:
      - offset: 0
        transform: { scale: 0.1 }
        target: { feature_type: dc-port, role: pv-tracker, quantity_kind: voltage }
        note: Voltage
      - offset: 1
        transform: { scale: 0.1 }
        target: { feature_type: dc-port, role: pv-tracker, quantity_kind: electric-current }
        note: Current
      - offset: 2
        target: { feature_type: dc-port, role: pv-tracker, quantity_kind: active-power }
        note: Power

  - slug: pv-tracker-vi
    content: { en: { title: PV tracker voltage and current } }
    datatype: int16
    placement:
      - { start: 39070, part: 1 }
      - { start: 39072, part: 2 }
      - { start: 39074, part: 3 }
      - { start: 39076, part: 4 }
      - { start: 39078, part: 5 }
      - { start: 39080, part: 6 }
    field:
      - offset: 0
        transform: { scale: 0.1 }
        target: { feature_type: dc-port, role: pv-tracker, quantity_kind: voltage }
        note: Voltage
      - offset: 1
        transform: { scale: 0.01 }
        target: { feature_type: dc-port, role: pv-tracker, quantity_kind: electric-current }
        note: Current

  # That generation answers PV power in its own run, one int32 per tracker.
  # foxess_modbus reads only the low word at 39280 on the H1-G2, claiming the
  # box never writes the upper one and so returns negatives malformed.
  - slug: pv-tracker-power
    content: { en: { title: PV tracker power } }
    datatype: int32
    placement:
      - { start: 39279, part: 1 }
      - { start: 39281, part: 2 }
      - { start: 39283, part: 3 }
      - { start: 39285, part: 4 }
      - { start: 39287, part: 5 }
      - { start: 39289, part: 6 }
    field:
      - offset: 0
        target: { feature_type: dc-port, role: pv-tracker, quantity_kind: active-power }
        note: Power
