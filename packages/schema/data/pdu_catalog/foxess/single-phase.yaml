pdu:
  - slug: sensors-single-phase
    content: { en: { title: Sensors } }
    condition: [ h1, h1-g2, kh ]
    start: 31006
    field:
      - offset: 0
        datatype: uint16
        transform: { scale: 0.1 }
        target: { quantity_kind: voltage }
        note: Grid Voltage
      - offset: 1
        datatype: int16
        transform: { scale: 0.1 }
        target: { quantity_kind: electric-current }
        note: Inverter Current
      - offset: 2
        datatype: int16
        target: { quantity_kind: active-power }
        note: Inverter Power
      - offset: 3
        datatype: uint16
        transform: { scale: 0.01 }
        target: { quantity_kind: frequency }
        note: Grid Frequency
      - offset: 4
        datatype: uint16
        transform: { scale: 0.1 }
        target: { quantity_kind: voltage }
        note: EPS Voltage
      - offset: 5
        datatype: int16
        transform: { scale: 0.1 }
        target: { quantity_kind: electric-current }
        note: EPS Current
      - { offset: 6, datatype: int16, target: { quantity_kind: active-power }, note: EPS Power }
      - offset: 7
        datatype: uint16
        transform: { scale: 0.01 }
        target: { quantity_kind: frequency }
        note: EPS Frequency
      - offset: 8
        datatype: int16
        target: { feature_type: ac-phase, role: grid, part: _, quantity_kind: active-power }
        note: Grid CT
      - offset: 9
        datatype: int16
        transform:
          kh-133: { scale: -1 } # kh-pre133 reads CT2 at 31052 instead, not here
