      - offset: 12
        datatype: int16
        transform: { scale: 0.1 }
        unit: °C
        target:
          feature_type: environment
          role: enclosure
          part: _
          quantity_kind: temperature
        note: Inverter Temp
      - offset: 13
        datatype: int16
        transform: { scale: 0.1 }
        unit: °C
        target: { quantity_kind: temperature }
        note: Ambient Temp
      - offset: 14
        datatype: int16
        transform: { scale: 0.1 }
        target: { quantity_kind: voltage }
        note: Inverter Battery Voltage
      - offset: 15
        datatype: int16
        transform: { scale: 0.1 }
        target: { quantity_kind: electric-current }
