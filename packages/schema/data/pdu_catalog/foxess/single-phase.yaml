      - offset: 16
        datatype: int16
        target: { quantity_kind: active-power }
        note: Inverter Battery Power
      - offset: 17
        datatype: int16
        transform: { scale: 0.1 }
        unit: °C
        target: { quantity_kind: temperature }
        note: Battery Temp
      - offset: 18
        datatype: uint16
        unit: '%'
        target: { quantity_kind: state-of-charge }
        note: Battery SoC
      - offset: 19
        datatype: uint16
        transform: { scale: 0.1 }
        target: { quantity_kind: electric-current }
        note: BMS Charge Rate
      - offset: 20
        datatype: uint16
        transform: { scale: 0.1 }
        target: { quantity_kind: electric-current }
        note: BMS Discharge Rate
      - offset: 33
        datatype: int16
        transform: { scale: 0.1 }
        target: { feature_type: dc-port, role: pv-tracker, part: 3, quantity_kind: voltage }
        note: PV3 Voltage
      - offset: 34
        datatype: int16
        transform: { scale: 0.1 }
        target:
          feature_type: dc-port
          role: pv-tracker
          part: 3
          quantity_kind: electric-current
