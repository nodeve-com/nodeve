      - offset: 36
        datatype: int16
        transform: { scale: 0.1 }
        target: { quantity_kind: voltage }
        note: PV4 Voltage
      - offset: 37
        datatype: int16
        transform: { scale: 0.1 }
        target: { quantity_kind: electric-current }
        note: PV4 Current
      - { offset: 38, datatype: int16, target: { quantity_kind: active-power }, note: PV4 Power }
      - offset: 39
        datatype: int32
        target: { quantity_kind: active-power }
        note: Inverter Power
      - { offset: 41, datatype: int32, target: { quantity_kind: active-power }, note: EPS Power }
      - offset: 43
        datatype: int32
        transform: { scale: -1 }
        target: { feature_type: ac-phase, role: grid, part: _, quantity_kind: active-power }
        note: Grid CT
      - offset: 45
        datatype: int32
        transform: { scale: -1 }
        target: { quantity_kind: active-power }
