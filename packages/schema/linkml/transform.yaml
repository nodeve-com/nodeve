id: https://nodeve.com/schema/lib/transform
name: transform
default_prefix: nodeve
default_range: string
classes:
  # Raw scalar → engineering value. The ONE place arithmetic and units live: a
  # decode row says where the bits are, a transform says what the number means.
  # Keyed by what it DOES, not by the device — 132 authored decode rows across
  # modbus + VE.Direct resolve to 20 distinct (scale, decimals, unit) triples,
  # so one row serves every field scaling that way, on any protocol.
  # Referenced, never inlined: a field FKs it, and a field needing no arithmetic
  # (18 of those 132) references none.
  Transform:
    title: Transform
    annotations: { sql_table: transform, keyed_by: slug }
    description: >-
      One raw scalar in, one engineering value out — scale, decimals, unit override. ARITHMETIC ONLY. Never reads bytes; never names a point; never maps a value to a symbol (that is a lookup — see Channel/DomainMember).
    slots: [ node, scale, decimals, unit ]
slots:
  # ── moved off modbus: arithmetic is protocol-neutral. A PduField references a
  # row; ModbusRegister still carries them until its decode rows fold into fields. ──
  decimals:
    range: integer
    title: Resolved decimals
    related_mappings: [ wikidata:Q1056761 ]
    description: 'decimal places the sensor actually resolves; the published value is rounded to it — decoding leaks precision the sensor never measured. Omit only when scale already lands on the real resolution'
    annotations: { i18n: { value: { title: { pt: Casas decimais resolvidas } } } }
  scale:
    range: float
    title: Scale
    related_mappings: [ wikidata:Q12121800 ]
    description: 'published value = raw × scale (raw → engineering units); omit ⇒ 1'
    annotations: { i18n: { value: { title: { pt: Escala } } } }
