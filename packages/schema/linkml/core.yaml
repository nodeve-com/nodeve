id: https://nodeve.com/schema/core
name: core

default_prefix: nodeve
default_range: string
classes:
  # The identity table — every addressable thing is ONE node row. node_type
  # (which kind) and slug (the local id) are identity, so they live HERE, not
  # repeated on every facet; permalink derives from node_type + the slug trail.
  Node:
    title: Node
    annotations: { sql_table: node }
    slots: [ permalink, code, node_type, slug, url, parent ]
    # the leaf segment: kebab, or `_` (the one unnamed interval)
    slot_usage: { slug: { pattern: '^([a-z0-9]+(-[a-z0-9]+)*|_)$' } }

  Registry:
    title: Registry
    annotations: { sql_table: registry }
    slots: [ node, publisher ]
    slot_usage: { publisher: { required: true } }

  # The org table — a facet attachable to ANY node (manufacturer, publisher).
  # A keyless 1:1 co-row sharing the node id, never product-specific.
  Organization:
    title: Organization
    annotations: { sql_table: organization }
    description: An organization — the relational analog of the _defaults cascade; manufacturers and publishers FK a row here.
    slots: [ node ]

  # A catalogued subject node — a thin MARKER on the device node, NOT a facet
  # bag. Which facets a device carries is driven by its node_type.facets rows;
  # every facet attaches to the node directly (its own top-level row-set, tied
  # back by node.parent). The one non-owned reference — the shared family
  # register map — is a `reference` relation, painted as a NodeEdge (subject =
  # device, predicate = the register_map relation, object = the shared map), so
  # it needs no bespoke column here.
  SubjectNode:
    title: Subject node
    annotations: { sql_table: subject_node, path_root: node_type }
    description: Marker row for a catalogued device node; its facets attach to the node, declared by node_type.
    slots: [ node ]

  # The ONE external-mapping table — every row that links out uses these, not a
  # per-registry scalar column. LinkML's native exact_mappings: annotates SCHEMA
  # elements; these are DATA rows, so the mapping is data too.
  Ref:
    title: Reference
    annotations:
      sql_table: ref
      # authored form: a map keyed by this slot's range (ref: {wikidata: …});
      # keys are bare registry slugs, the normalizer expands them to CURIEs
      keyed_by: registry
    slots: [ node, registry, term, match ]

  # Every titled slot projects to a Property row so its user-facing form label
  # can be localized. LinkML `title:` is ONE English string; a form field needs
  # translations, so the en Content is GENERATED from the slot title and other
  # languages are authored data about this node. Dev-facing `description:` stays
  # schema meta — it is not a Property column and is never localized.
  Property: { title: Property, annotations: { sql_table: property }, slots: [ node ] }

  # A directed triple — subject/predicate/object each FK the node table; position
  # orders parallel edges off one subject. The graph layer over the node core.
  NodeEdge:
    title: Node edge
    annotations: { sql_table: node_edge }
    slots: [ subject, predicate, object, position ]

  # Reusable localized content. Each row has its own node; `about` points to
  # the described node. No class-specific parent FK.
  Content:
    title: Content
    annotations:
      sql_table: content
      # authored form: a map keyed by this slot (content: {en: …, pt: …});
      # the normalizer reads it here, never hardcodes it
      keyed_by: language
    slots: [ node, about, language, title, lede, body ]
slots:
  body: { title: Body, exact_mappings: [ schema:articleBody ] }
  code:
    range: string
    title: Short code
    related_mappings: [ schema:identifier ]
    description: "8-char Crockford human handle DERIVED from the permalink's hash tail (40 bits); minted with the row, never recomputed"
  iri_template:
    range: string
    title: IRI template
    close_mappings: [ schema:urlTemplate ]
    description: 'resolves a term to its IRI — {id} is the term slot (http://qudt.org/property/quantitykind/{id}); absent when the registry has no resolvable form'
    annotations: { camel: iriTemplate }
  language:
    range: string
    required: true
    title: Language
    exact_mappings: [ schema:inLanguage ]
    slot_uri: schema:inLanguage
    description: 'BCP 47 language tag'
  lede: { title: Lede, exact_mappings: [ schema:abstract ], description: short description }
  match:
    range: MatchStrength
    required: true
    title: Match
    related_mappings: [ skos:mappingRelation ]
    description: 'how closely the ref maps its row to the external term — the SKOS mapping strengths'
    annotations: { i18n: { value: { title: { pt: Correspondência } } } }
  ordinal:
    range: integer
    minimum_value: 1
    title: Ordinal
    exact_mappings: [ schema:position ]
    description: "sort/join key of a part-set member. Derived from authored position, never hand-typed — SQL rows carry no order, so the document's order is materialized here."
    annotations: { i18n: { value: { title: { pt: Ordinal } } } }
  permalink:
    identifier: true
    range: uriorcurie
    title: Permalink
    exact_mappings: [ wikidata:Q1048975 ]
    description: 'permalink PK — node:<node_type>/<slug path> CURIE minted from the qualified slug trail. A creation-time fact: renames/re-filing do NOT re-derive it'
  position:
    range: integer
    minimum_value: 1
    title: Position
    exact_mappings: [ schema:position ]
    description: 'sort key of parallel edges off one subject'
  term:
    range: string
    required: true
    title: Term
    exact_mappings: [ skos:notation ]
    description: 'the identifier AS the registry spells it (Q25428, ActivePower, voltage) — never normalized'
    annotations: { i18n: { value: { title: { pt: Termo } } } }
  title: { title: Title, exact_mappings: [ dcterms:title ] }
  url:
    range: uri
    title: URL
    exact_mappings: [ schema:url ]
    description: 'the thing''s own web address — a node attribute, authored under the `node:` block'
  # object-valued slots — FKs / owned row sets; global like everything else,
  # classes narrow via slot_usage only when the shared def is too loose
  about:
    range: Node
    required: true
    title: About
    exact_mappings: [ schema:about ]
    slot_uri: schema:about
    description: 'the node this content describes'
  node_type:
    range: NodeType
    title: Node type
    related_mappings: [ schema:category ]
    description: 'FK on the node — which kind of thing it is (inverter, ac-meter, registry, organization). A ROW, not a class CURIE: a new node type is an INSERT, never a DDL migration. Permalink root = its slug'
    annotations: { camel: nodeType }
  object:
    range: Node
    required: true
    title: Object
    exact_mappings: [ rdf:object ]
    description: 'FK — the node the edge points to'
  organization:
    range: Organization
    title: Organization
    exact_mappings: [ schema:manufacturer ]
    description: 'FK — the organization that made this thing'
    annotations: { i18n: { value: { title: { pt: Organização } } } }
  parent:
    range: Node
    title: Parent
    exact_mappings: [ schema:isPartOf ]
    description: 'self-FK — the nearest ancestor node in the permalink trail (a feature''s parent is its device, an interval''s its feature). Derived, never authored; null for a root'
  predicate:
    range: Node
    required: true
    title: Predicate
    exact_mappings: [ rdf:predicate ]
    description: 'FK — the node naming the relation'
  publisher:
    range: Organization
    title: Publisher
    slot_uri: schema:publisher
    description: 'FK — the organization that publishes this registry'
    annotations: { i18n: { value: { title: { pt: Editora } } } }
  registry:
    range: Registry
    required: true
    title: Registry
    exact_mappings: [ skos:inScheme ]
    description: 'FK — which external registry the term belongs to'
    annotations: { i18n: { value: { title: { pt: Registro } } } }
  subject:
    range: Node
    required: true
    title: Subject
    exact_mappings: [ rdf:subject ]
    description: 'FK — the node the edge points from'

# ─── ENUMS ────────────────────────────────────────────────────────────────────
# CLOSED GRAMMAR vocabularies only. Part keys (phase a/b/c, l1/l2, tracker
# positions) are per-model discriminators on Interval, validated against a
# feature's part_set or count — never a new column or a DDL migration.
enums:
  MatchStrength:
    title: Match strength
    description: SKOS mapping strength — closed grammar, so an enum and not a table.
    permissible_values:
      exact: { title: Exact match, meaning: skos:exactMatch }
      close: { title: Close match, meaning: skos:closeMatch }
      broad: { title: Broader match, meaning: skos:broadMatch }
      narrow: { title: Narrower match, meaning: skos:narrowMatch }
      related: { title: Related match, meaning: skos:relatedMatch }
