id: https://nodeve.com/schema/lib/product
name: product
default_prefix: nodeve
default_range: string
classes:
  Organization:
    title: Organization
    annotations: { sql_table: organization }
    description: Own table — the relational analog of the _defaults cascade; every FoxESS product FKs one row.
    slots: [ node ]

  Product:
    title: Product
    annotations: { sql_table: product }
    description: Product identity feature — what grimoire's `product:` block was.
    slots: [ node, model, series, organization ]
    slot_usage: { organization: { required: true } }

  # Mechanical facet — the datasheet's physical block. A keyless 1:1 co-row on
  # the node (like Product), NOT a feature/interval: dimensions are fixed body
  # facts, not measurands with operating bands.
  Physical:
    title: Physical
    annotations: { sql_table: physical }
    description: Mechanical dimensions and mass of the physical body — datasheet nameplate, one row per node.
    slots: [ node, width, height, thickness, mass ]

  # ── device layer: ONE table ──
  # Rows are MODELS (organization + model number); node_type says which kind
  # of device the model is. NO type-specific class lives here — that is the
  # invariant that keeps a new node type an INSERT: per-type classes exist
  # ONLY in the projected schema, which gen-sqlddl never reads. Adding one
  # must leave gen-sqltables output byte-identical.
  SubjectNode:
    title: Subject node
    annotations:
      sql_table: subject_node
      # permalink root = the node TYPE's slug, not this table's name — the
      # normalizer reads the named slot's value as the path root
      path_root: node_type
    description: A catalogued subject node — the assembly of feature-of-interest rows its type calls for.
    slots:
      - node
      - product
      - network_interfaces
      - services
      - register_map
      - settings
      - channels
      - ac_ports
      - dc_ports
      - environments
      - physical
    slot_usage: { product: { required: true } }
slots:
  height:
    range: float
    title: Height
    exact_mappings: [ schema:height ]
    description: 'body height, millimetres'
  mass:
    range: float
    title: Mass
    exact_mappings: [ schema:weight ]
    description: 'body mass, kilograms'
  model:
    title: Model
    exact_mappings: [ schema:model ]
    description: 'what the thing is called — the model designation on the nameplate'
    annotations: { i18n: { value: { title: { pt: Modelo } } } }
  series: { title: Series, related_mappings: [ schema:ProductGroup ] }
  thickness:
    range: float
    title: Thickness
    related_mappings: [ schema:depth ]
    description: 'body thickness/depth, millimetres'
  width:
    range: float
    title: Width
    exact_mappings: [ schema:width ]
    description: 'body width, millimetres'
  ac_ports:
    range: FeatureOfInterest
    multivalued: true
    inlined_as_list: true
    title: AC ports
    related_mappings: [ sosa:FeatureOfInterest ]
    description: "AC port ROWS — which socket each fills lives in its role, never a column name; phase count is the feature's part rows (a/b/c, l1/l2, or none), never the type"
    annotations: { camel: acPorts }
  dc_ports:
    range: FeatureOfInterest
    multivalued: true
    inlined_as_list: true
    title: DC ports
    related_mappings: [ sosa:FeatureOfInterest ]
    description: "DC port ROWS — one per socket (pv-tracker, battery); how MANY trackers or battery ports is that feature's part rows"
    annotations: { camel: dcPorts }
  environments:
    range: FeatureOfInterest
    multivalued: true
    inlined_as_list: true
    title: Environments
    related_mappings: [ sosa:FeatureOfInterest ]
    description: 'environment ROWS — the things a temperature/humidity reading attaches to; role says which (ambient = rated operating conditions, enclosure = internal sensor)'
  network_interfaces:
    range: NetworkInterface
    multivalued: true
    inlined_as_list: true
    title: Network interfaces
    related_mappings: [ wikidata:Q165233 ]
    annotations: { camel: networkInterfaces }
  node_type:
    range: NodeType
    title: Node type
    related_mappings: [ schema:category ]
    description: 'FK on the node — which kind of thing it is (inverter, ac-meter, registry, organization). A ROW, not a class CURIE: a new node type is an INSERT, never a DDL migration. Permalink root = its slug'
    annotations: { camel: nodeType }
  organization:
    range: Organization
    title: Organization
    exact_mappings: [ schema:manufacturer ]
    description: 'FK — the organization that made this thing'
    annotations: { i18n: { value: { title: { pt: Organização } } } }
  physical:
    range: Physical
    inlined: true
    title: Physical
    related_mappings: [ schema:depth ]
  product: { range: Product, inlined: true, title: Product, exact_mappings: [ schema:Product ] }
  register_map:
    range: RegisterMap
    inlined: true
    title: Register map
    related_mappings: [ wikidata:Q1135322 ]
    description: 'FK to the shared family map — inlined only for the single-file example'
    annotations: { camel: registerMap }
  services:
    range: ServiceBinding
    multivalued: true
    inlined_as_list: true
    title: Services
    related_mappings: [ schema:Service ]
