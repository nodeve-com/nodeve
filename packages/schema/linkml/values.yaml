id: https://nodeve.com/schema/values
name: values
default_prefix: nodeve
default_range: string
classes:
  # ── categorical value contracts: the enum-valued sibling of Interval ──
  # ValuedRange owns the quantitative contract; these own the categorical one.
  # Vocabulary members are ROWS, never inline enums or schema enums — a new
  # state / fault / option is an INSERT. Setting = site-authored knob;
  # Channel = device-observed value. Both own DomainMember rows.
  Setting:
    title: Setting
    annotations:
      sql_table: setting
      # authored form: a map keyed by this slot (setting: {grid-region: …})
      keyed_by: slug
    description: >-
      Commissioning knob — single-valued, fixed at install. CATEGORICAL: its value vocabulary is its member rows; a Condition FKs the setting AND one member, so a typo'd gate value dies at the database's FK gate instead of silently never matching. QUANTITATIVE: it moves ONE bound of ONE band — `interval` + `bound` — so a band stays named for its function (a `running` zone) and the knobs address its edges, never the reverse. `valued_range` here is what the KNOB accepts: min/max the legal envelope, value the factory default — authored only where the manual documents it, never fabricated.
    slots: [ node, required, members, part, interval, bound, valued_range, note ]

  Channel:
    title: Channel
    annotations:
      sql_table: channel
      # authored form: a map keyed by this slot (channel: {run-state: …})
      keyed_by: slug
    description: >-
      Categorical observable of the device root (run state, fault set) — enum-valued, not VIM-ranged: no quantity_kind, no interval. Reported as a SET of members; `empty` is the member reported when none apply. Members derive from register flag labels plus `empty` — authored ONCE, at the wire mapping.
    slots: [ node, empty, members ]

  DomainMember:
    title: Domain member
    annotations: { sql_table: domain_member, keyed_by: slug }
    description: >-
      One member of a categorical vocabulary — a Setting option or a Channel state/fault. Ordered by authored position, like PartSetMember.
    slots: [ node, ordinal ]
slots:
  bound:
    range: Bound
    title: Bound
    related_mappings: [ schema:minValue, schema:maxValue ]
    description: 'which slot of the target band a quantitative knob writes — a ValuedRange edge or the specification dwell time; two knobs on one band (a high and a low threshold) are two bounds of ONE interval, never two intervals'
  channels:
    range: Channel
    multivalued: true
    inlined_as_list: true
    title: Channels
    related_mappings: [ sosa:ObservableProperty ]
  empty:
    range: DomainMember
    title: Empty member
    related_mappings: [ schema:defaultValue ]
    description: 'FK — the member reported when no flag bit is set (unknown, none); a member like any other, just wired to no bit'
  members:
    range: DomainMember
    multivalued: true
    inlined_as_list: true
    title: Members
    exact_mappings: [ skos:member ]
    description: 'the vocabulary — one row per admissible value, ordinal from authored position'
  settings:
    range: Setting
    multivalued: true
    inlined_as_list: true
    title: Settings
    related_mappings: [ schema:PropertyValueSpecification ]
enums:
  # the addressable slots of a band — an interval's own ValuedRange edges plus
  # the dwell time on its Specification. A knob names one; the band names none.
  Bound:
    title: Bound
    permissible_values:
      min:
        title: Minimum
        exact_mappings: [ schema:minValue ]
        annotations: { i18n: { value: { title: { pt: Mínimo } } } }
      max:
        title: Maximum
        exact_mappings: [ schema:maxValue ]
        annotations: { i18n: { value: { title: { pt: Máximo } } } }
      value:
        title: Value
        close_mappings: [ qudt:Quantity ]
        annotations: { i18n: { value: { title: { pt: Valor } } } }
      duration:
        title: Duration
        close_mappings: [ cim:OperationalLimitType.acceptableDuration ]
        annotations: { i18n: { value: { title: { pt: Duração } } } }
