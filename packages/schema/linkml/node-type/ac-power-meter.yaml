# AcPowerMeter — hand-cut mirror of what data2schema projects from
# data/node_type/ac-power-meter.yaml + data/feature_type/ac-phase.yaml.
# One ac-phase socket (role `point`, required). Phase count is the model's
# part rows, not this type. Authored form is the rows; this is the derived
# validation cut — never the source.
id: https://nodeve.com/schema/node-type/ac-power-meter
name: ac-power-meter

default_prefix: nodeve
default_range: string
imports:
  - ../nodeve

enums:
  AcPowerMeterAcPhaseRole:
    permissible_values: { point: {} }

  # ac-phase admissible quantity set — keys ARE the stored quantity_kind
  # CURIEs, so the enum range validates the value directly (was any_of).
  AcPhaseInterval:
    permissible_values:
      node:quantity-kind/voltage: {}
      node:quantity-kind/electric-current: {}
      node:quantity-kind/frequency: {}
      node:quantity-kind/active-power: {}
      node:quantity-kind/apparent-power: {}
      node:quantity-kind/reactive-power: {}
      node:quantity-kind/power-factor: {}
      node:quantity-kind/phase-difference: {}
      node:quantity-kind/active-energy: {}
      node:quantity-kind/apparent-energy: {}
      node:quantity-kind/reactive-energy: {}

classes:
  # feature-type cut: ac-phase admissible quantity set, closed any_of of the
  # bound quantity-kind CURIEs (the AcPhaseInterval enum). An unbound
  # quantity fails the enum-range check.
  AcPhaseIntervalRow:
    is_a: Interval
    slot_usage:
      quantity_kind: { range: AcPhaseInterval }

  AcPhaseFeature:
    is_a: FeatureOfInterest
    slot_usage:
      intervals: { range: AcPhaseIntervalRow }
      feature_type: { equals_string: node:feature-type/ac-phase }

  # node-type socket: which roles this feature fills on AcPowerMeter
  AcPowerMeterAcPhaseFeature:
    is_a: AcPhaseFeature
    slot_usage:
      role: { range: AcPowerMeterAcPhaseRole }

  AcPowerMeter:
    is_a: SubjectNode
    slot_usage:
      node_type: { equals_string: node:node-type/ac-power-meter }
      ac_ports: { range: AcPowerMeterAcPhaseFeature, required: true }
