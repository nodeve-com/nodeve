# LinkML test-cut of the grimoire schema layer, relational-first.
# Mapping: property → slot (global, reused), feature → class (reusable table),
# node_type → class assembling feature classes (LinkML has no metaclass — see NOTES.md).
# gen-sqlddl / gen-pydantic / gen-json-schema all consume this one file.
id: https://nodeve.com/schema
name: schema

default_prefix: nodeve
default_range: string

prefixes:
  skos: http://www.w3.org/2004/02/skos/core#
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  linkml: https://w3id.org/linkml/
  nodeve: https://nodeve.com/schema/
  node: https://nodeve.com/node/
  qudt: http://qudt.org/schema/qudt/
  # mapping targets (grimoire property refs → *_mappings)
  sosa: http://www.w3.org/ns/sosa/
  cim: 'http://iec.ch/TC57/CIM100#'
  ssn_system: http://www.w3.org/ns/ssn/systems/
  vim: https://jcgm.bipm.org/vim/en/
  schema: http://schema.org/ # linkml:types defines it http-form; a mismatch fails the merge
  # enum-value meaning/mapping targets — namespace is the registry row's own url
  ha_state_class: https://developers.home-assistant.io/docs/core/entity/sensor/#available-state-classes
  prometheus: https://prometheus.io/docs/concepts/metric_types/
  iana_iftype: https://www.iana.org/assignments/ianaiftype-mib/ianaiftype-mib
  iana_uri_scheme: https://www.iana.org/assignments/uri-schemes/
  iso_11898: https://www.iso.org/standard/63648.html
  iso_8601: https://www.iso.org/iso-8601-date-and-time-format.html
  tia_standard: https://tiaonline.org/
  jedec_standard: https://www.jedec.org/standards-documents/docs/jesd8
  iec_60381: https://webstore.iec.ch/publication/2050
  isa_18_2: https://www.isa.org/standards-and-publications/isa-standards/isa-standards-committees/isa18
  rfc_5424: https://www.rfc-editor.org/rfc/rfc5424
  modbus_org: https://www.modbus.org/specs.php
  xsd: http://www.w3.org/2001/XMLSchema#
  wikidata: http://www.wikidata.org/entity/
  saref: https://saref.etsi.org/core/
  iso_25012: https://www.iso.org/standard/35736.html # data-quality model — desirable-band tiers
  dcterms: http://purl.org/dc/terms/
  owl: http://www.w3.org/2002/07/owl#

imports:
  - linkml:types
  - shared
  - enums
  - core
  - taxonomy
  - features
  - values
  - product
  - network
  - modbus
