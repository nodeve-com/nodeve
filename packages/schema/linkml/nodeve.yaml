id: https://nodeve.com/schema
name: schema

default_prefix: nodeve
default_range: string

# DERIVED from data/registry — do not edit; run `pnpm generate`
prefixes:
  brick: https://brickschema.org/schema/Brick#
  cim: http://iec.ch/TC57/CIM100#
  dcterms: http://purl.org/dc/terms/
  ha-state-class: https://developers.home-assistant.io/docs/core/entity/sensor/#available-state-classes
  iana-iftype: https://www.iana.org/assignments/ianaiftype-mib/ianaiftype-mib
  iana-uri-scheme: https://www.iana.org/assignments/uri-schemes/
  iec-60381: https://webstore.iec.ch/publication/2050
  isa-18-2: https://www.isa.org/standards-and-publications/isa-standards/isa-standards-committees/isa18
  iso-11898: https://www.iso.org/standard/63648.html
  iso-25012: https://www.iso.org/standard/35736.html
  iso-8601: https://www.iso.org/iso-8601-date-and-time-format.html
  itu-r-m1371: https://www.itu.int/rec/R-REC-M.1371/en
  jedec-standard: https://www.jedec.org/standards-documents/docs/jesd8
  linkml: https://w3id.org/linkml/
  modbus-org: https://www.modbus.org/specs.php
  node: https://nodeve.com/node/
  nodeve: https://nodeve.com/schema/
  owl: http://www.w3.org/2002/07/owl#
  prometheus: https://prometheus.io/docs/concepts/metric_types/
  qudt: http://qudt.org/schema/qudt/
  qudt-quantity-kind: https://qudt.org/vocab/quantitykind/
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rfc-5424: https://www.rfc-editor.org/rfc/rfc5424
  saref: https://saref.etsi.org/core/
  saref4grid: https://saref.etsi.org/saref4grid/
  schema: http://schema.org/
  seas: https://w3id.org/seas/
  skos: http://www.w3.org/2004/02/skos/core#
  sosa: http://www.w3.org/ns/sosa/
  ssn: http://www.w3.org/ns/ssn/
  ssn-system: http://www.w3.org/ns/ssn/systems/
  tia-standard: https://tiaonline.org/
  victron: https://www.victronenergy.com/
  vim: https://jcgm.bipm.org/vim/en/
  wgs84-geo: http://www.w3.org/2003/01/geo/wgs84_pos#
  wikidata: http://www.wikidata.org/entity/
  xsd: http://www.w3.org/2001/XMLSchema#

imports:
  - linkml:types
  - shared
  - cargo-type
  - nav-status
  - rating
  - ship-type
  - severity
  - state
  - test-condition
  - trigger-on
  - zone
  - core
  - taxonomy
  - features
  - values
  - product
  - physical
  - refrigerant
  - network
  - link
  - decode
  - emit
  - adapter
  - inventory
  - site
  - track
  - vessel

classes:
  # The bundle manifest: the shape of gen/catalog.json — each attribute one
  # table's row-set — and the tree_root the load + linkml-validate hang off.
  # NOT a table: the loader inserts each row-set straight into its table, so
  # ddl.py drops this container and the backref FK it would stamp on every row.
  # The ONE sanctioned `attributes:`.
  Catalog:
    title: Catalog
    tree_root: true
    attributes:
      # DERIVED, not a data dir — bundle.ts mints one row per authored thing from
      # its path. Every other slot's range names a class whose sql_table is its dir.
      nodes: { range: Node, multivalued: true, inlined_as_list: true }
      # DERIVED — the universal Content facet, accumulated from every authored
      # `content:` block plus generated Property labels. Keyed by `about`, a
      # top-level row-set, NEVER nested under the row it describes.
      contents: { range: Content, multivalued: true, inlined_as_list: true }
      registries: { range: Registry, multivalued: true, inlined_as_list: true }
      # GENERATED from schema slot titles, not a data dir — see build().
      properties: { range: Property, multivalued: true, inlined_as_list: true }
      organizations: { range: Organization, multivalued: true, inlined_as_list: true }
      part_sets: { range: PartSet, multivalued: true, inlined_as_list: true }
      quantity_kinds: { range: QuantityKind, multivalued: true, inlined_as_list: true }
      refrigerants: { range: Refrigerant, multivalued: true, inlined_as_list: true }
      # the wire vocabularies — a signalling standard and a framing over it, rows
      # because their attributes are the standard's, not each device's
      physical_layers: { range: PhysicalLayer, multivalued: true, inlined_as_list: true }
      link_protocols: { range: LinkProtocol, multivalued: true, inlined_as_list: true }
      feature_types: { range: FeatureType, multivalued: true, inlined_as_list: true }
      variables: { range: Variable, multivalued: true, inlined_as_list: true }
      node_types: { range: NodeType, multivalued: true, inlined_as_list: true }
      # device facets — each a top-level row-set, tied to its device node by the
      # node.parent trail (owned children) or a node-PK-shared co-row (product,
      # physical). Populated by the data/subject_node/ device walk, not a data dir.
      transforms: { range: Transform, multivalued: true, inlined_as_list: true }
      # the decode dictionaries devices reference — a publisher's rows, no device
      # in them, so a top-level row-set with its own data dir (unlike a facet)
      pdu_catalogs: { range: PduCatalog, multivalued: true, inlined_as_list: true }
      products: { range: Product, multivalued: true, inlined_as_list: true }
      physicals: { range: Physical, multivalued: true, inlined_as_list: true }
      locations: { range: Location, multivalued: true, inlined_as_list: true }
      refrigerations: { range: Refrigeration, multivalued: true, inlined_as_list: true }
      feature_of_interests: { range: FeatureOfInterest, multivalued: true, inlined_as_list: true }
      settings: { range: Setting, multivalued: true, inlined_as_list: true }
      channels: { range: Channel, multivalued: true, inlined_as_list: true }
      # PROJECTED from the enums marked `state_set` — the options nest inside,
      # so there is no data dir and no second place the values are written
      state_sets: { range: StateSet, multivalued: true, inlined_as_list: true }
      states: { range: State, multivalued: true, inlined_as_list: true }
      network_interfaces: { range: NetworkInterface, multivalued: true, inlined_as_list: true }
      ip_bindings: { range: IpBinding, multivalued: true, inlined_as_list: true }
      endpoints: { range: Endpoint, multivalued: true, inlined_as_list: true }
      service_bindings: { range: ServiceBinding, multivalued: true, inlined_as_list: true }
      link_bindings: { range: LinkBinding, multivalued: true, inlined_as_list: true }
      # site facets — the deployment shape; instances live in deploying repos
      # (sites/<name>), so these row-sets are empty in the base catalog.
      emits: { range: Emit, multivalued: true, inlined_as_list: true }
      ingests: { range: Ingest, multivalued: true, inlined_as_list: true }
      modbus_tap_windows: { range: ModbusTapWindow, multivalued: true, inlined_as_list: true }
      inventories: { range: Inventory, multivalued: true, inlined_as_list: true }
      sites: { range: Site, multivalued: true, inlined_as_list: true }
      authentications: { range: Authentication, multivalued: true, inlined_as_list: true }
      # thin marker: a catalogued device node + its one non-owned ref (register map)
      # tracked-body facet — authored like any other facet on a device node
      vessels: { range: Vessel, multivalued: true, inlined_as_list: true }
      # the areas a track is queried against — nodes, so authored rows
      geofences: { range: Geofence, multivalued: true, inlined_as_list: true }
      subject_nodes: { range: SubjectNode, multivalued: true, inlined_as_list: true }
      node_edges: { range: NodeEdge, multivalued: true, inlined_as_list: true }
