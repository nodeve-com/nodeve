# LinkML test-cut of the grimoire schema layer, relational-first.
# Mapping: property → slot (global, reused), feature → class (reusable table),
# archetype → class assembling feature classes (LinkML has no metaclass — see NOTES.md).
# gen-sqlddl / gen-pydantic / gen-json-schema all consume this one file.
id: https://nodeve.com/schema
name: nodeve
prefixes:
  skos: http://www.w3.org/2004/02/skos/core#
  linkml: https://w3id.org/linkml/
  nodeve: https://nodeve.com/schema/
  node: https://nodeve.com/node/
  qudt: http://qudt.org/schema/qudt/
  schema: http://schema.org/ # linkml:types defines it http-form; a mismatch fails the merge
default_prefix: nodeve
default_range: string
imports:
  - linkml:types
  - nodeve-slots

# ─── CLASSES ─────────────────────────────────────────────────────────────────
classes:
  # One uuid space for everything: every entity's PK row exists here first, so
  # any table can point at "a thing" (node) without knowing its class, and a
  # 1:1 feature can share its owner's node row. Every class below carries the
  # `node` slot — PK + FK to this table (enforced, not convention). `code`
  # rides with the uuid: minted once per THING, not per class.
  Node:
    annotations:
      sql_table: node
    slots: [slug_qualified, code]

  # Parts belong to the FEATURE, not its type: how a model subdivides a port is
  # a per-model fact (3 trackers vs 2 battery ports; split-phase l1/l2 vs
  # three-phase a/b/c). A part with no intervals still exists — it is a row.
  # Authoring stays terse via desugaring (`phases: split` → two rows); the
  # schema only ever sees the flat rows.
  Part:
    annotations:
      sql_table: part
    slots: [node, slug, ordinal, contents]

  # The definition registry AS DATA — grimoire's feature layer becomes rows.
  # One row per feature type. (Resolves the metaclass gap the honest way:
  # definitions the schema can't be meta about are themselves rows the catalog
  # FKs.) Each row binds which quantities its features may carry (QuantityBinding
  # rows — aspect flags, not two sets). The VALIDATION overlay
  # (nodeve-projected.yaml) is this table restated as LinkML, one stencil
  # per row — never fed to gen-sqlddl, or each stencil becomes a table and
  # fragments the uniform ones.
  FeatureType:
    annotations:
      sql_table: feature_type
    slots: [node, slug, quantity_bindings, contents]

  # The device-type registry — the archetype layer as rows, exactly parallel to
  # FeatureType. A new device type (dehumidifier, ac-meter) is an INSERT here
  # plus its FeatureType rows; no table is added, no column changes. The socket
  # contract (which feature types are required, which roles exist) lands here
  # in a later pass — today it is still implied by the archetype's slot names.
  DeviceType:
    annotations:
      sql_table: device_type
    slots: [node, slug, socket_bindings, contents]

  # One row per device type × socket. Was implied by the overlay's role enums
  # and required-ness — now the data those are GENERATED from.
  SocketBinding:
    annotations:
      sql_table: socket_binding
      # authored form: a map keyed by this slot (socket_binding: {out: …})
      keyed_by: role
    slots: [node, feature_type, role, required]

  # The ingest container — linkml-sqldb needs ONE root object per dump, so the
  # sharded data/ rows bundle under this. NOT a table: tree_root exists to be
  # unwrapped, and `gen-sqltables` emits it as an empty single-row table that
  # nothing FKs. The ONE sanctioned `attributes:` in the repo — these are the
  # container's own bundle slots, not domain fields, and a global slot named
  # `registries` would be meaningless on any other class.
  Catalog:
    tree_root: true
    annotations:
      sql_table: catalog
    attributes:
      # DERIVED, not a data dir — bundle.ts mints one row per authored thing from
      # its path. Every other slot's range names a class whose sql_table is its dir.
      nodes: { range: Node, multivalued: true, inlined_as_list: true }
      registries: { range: Registry, multivalued: true, inlined_as_list: true }
      quantity_kinds: { range: QuantityKind, multivalued: true, inlined_as_list: true }
      feature_types: { range: FeatureType, multivalued: true, inlined_as_list: true }
      device_types: { range: DeviceType, multivalued: true, inlined_as_list: true }
      device_models: { range: DeviceModel, multivalued: true, inlined_as_list: true }

  # The external-registry table — one row per registry we map into (qudt,
  # wikidata, ha_device_class). A new registry is an INSERT; the iri_template
  # lives here so a term is stored exactly as that registry spells it.
  Registry:
    annotations:
      sql_table: registry
    slots: [node, slug, url, iri_template, contents]

  # The ONE external-mapping table — every row that links out uses these, not a
  # per-registry scalar column. LinkML's native exact_mappings: annotates SCHEMA
  # elements; these are DATA rows, so the mapping is data too.
  Ref:
    annotations:
      sql_table: ref
      # authored form: a map keyed by this slot's range (ref: {wikidata: …});
      # keys are bare registry slugs, the normalizer expands them to CURIEs
      keyed_by: registry
    slots: [node, registry, term, match]

  # The quantity master list AS ROWS — bulk-loaded from QUDT (grimoire's
  # concepts/enumeration/quantity_kind), never hand-extended. Was an enum; an
  # enum can't be refined (LinkML `is_a` on enums neither constrains nor
  # inherits — a typo'd projected value just becomes a new permissible value),
  # so the master list is a table and every citation is an FK. Adding a kind is
  # an INSERT, exactly like feature type and device type.
  QuantityKind:
    annotations:
      sql_table: quantity_kind
    slots:
      [
        node,
        slug,
        si_unit,
        accumulation,
        deprecated,
        deprecated_in,
        replaced_by,
        broader,
        refs,
        contents,
      ]

  # One row per feature type × quantity — the feature type's admissible set as
  # data. The overlay projects ONE enum per feature type from these rows,
  # validated once on Interval. Membership is the whole contract: which facets
  # an interval carries is a fact of the model, not the type.
  QuantityBinding:
    annotations:
      sql_table: quantity_binding
      # authored form: a map keyed by this slot's range (quantity_binding: {voltage: …})
      keyed_by: quantity_kind
    slots: [node, quantity_kind]

  # Reusable localized content. Each row has its own node; `about` points to
  # the described node. No class-specific parent FK.
  Content:
    annotations:
      sql_table: content
      # authored form: a map keyed by this slot (content: {en: …, pt: …});
      # the normalizer reads it here, never hardcodes it
      keyed_by: language
    slots: [node, about, language, title, lede, body]

  # ── feature layer: reusable tables ──
  # The valued-range table (grimoire features/valued_range.yaml): one
  # distinguished point + the band around it — absolute (tolerance) and
  # relative (margin) families, symmetric + asymmetric. A width facet of
  # Interval: its own table, sharing the interval's node.
  ValuedRange:
    annotations:
      sql_table: valued_range
    description: >-
      A single point (value) plus the tolerated band around it (min/max OPTIONAL — value-only, one-sided, or full all legal; never fabricate a band). Quantity-agnostic: the owning row supplies the quantity; unit stays here with the numbers it scales.
    slots:
      - node
      - min
      - max
      - value
      - unit
      - tolerance
      - tolerance_lower
      - tolerance_upper
      - margin
      - margin_lower
      - margin_upper

  # Interval is the ONE quantity-band table — every quantity assertion on a
  # feature is an Interval row; quantity admissibility is validated HERE, once.
  # Specification / Measurement are 1:1 WIDTH EXTENSIONS sharing the interval's
  # node row (the Product-on-DeviceModel trick) — narrow tables, no repeated
  # core columns. Uniqueness: one row per (feature, quantity_kind, part, slug).
  Interval:
    annotations:
      sql_table: interval
    description: >-
      One quantity band on one feature. part null = combined; slug discriminates multiple rows per (quantity_kind, part). Aspect payloads hang off as width extensions — THEY point here (shared node), never back.
    slots: [node, quantity_kind, valued_range, part, slug]
    slot_usage:
      # the discriminator, not decoration — (quantity_kind, part, slug) is the
      # row's identity and its node path segment. Absent slug = no derivable node.
      slug: { required: true }

  Specification:
    annotations:
      sql_table: specification
    description: >-
      BEHAVIOURAL payload — spec rating, operating zone, severity tier, or condition-gated derate. Shares its interval's node row.
    slots: [node, conditions, rating, zone, severity, duration, trigger_on]

  Measurement:
    annotations:
      sql_table: measurement
    description: >-
      MEASURABLE-channel payload — what a sensor reports: resolution and the energy-channel discriminators. Shares its interval's node row.
    slots: [node, flow_direction, period, resolution]

  Condition:
    annotations:
      sql_table: condition
    description: >-
      Gate on an interval — either a commissioning-setting equality or a pointer at another interval (the derate anchor).
    slots: [node, setting_key, equals, gated_by]

  FeatureOfInterest:
    annotations:
      sql_table: feature_of_interest
    abstract: true
    description: >-
      The ONE feature table (SOSA feature-of-interest): a named attachment point that refines all possible measurands to a known admissible set — a temperature attaches to an environment row exactly as a voltage attaches to a port row. role IS the socket name (out, grid, pv-tracker, battery, ambient) — one row per socket. Repetition within a socket is PARTS, not rows: three trackers = one pv-tracker feature owning three part rows. Parts are per-model (a/b/c, l1/l2, 1/2/3) because models differ; part NULL on an interval = combined, the whole feature.
    slots: [node, feature_type, role, parts, intervals, specifications, measurements, contents]
    slot_usage:
      role: { required: true }
      feature_type: { required: true }

  Manufacturer:
    annotations:
      sql_table: manufacturer
    description: Own table — the relational analog of the _defaults cascade; every FoxESS product FKs one row.
    slots: [node, slug, contents]

  Product:
    annotations:
      sql_table: product
    description: Product identity feature — what grimoire's `product:` block was.
    slots: [node, model, series, manufacturer]
    slot_usage:
      manufacturer: { required: true }

  NetworkInterface:
    annotations:
      sql_table: network_interface
    slots: [node, slug, interface_type, link_speed]
    slot_usage:
      interface_type: { required: true }

  ServiceBinding:
    annotations:
      sql_table: service_binding
    slots: [node, slug, port, service_protocol, network_interface]
    slot_usage:
      service_protocol: { required: true }
      network_interface: { required: true }

  # ── comms layer: OUT of the device. Shared per manufacturer-family;
  # many products FK the same map. ──
  RegisterMap:
    annotations:
      sql_table: register_map
    slots: [node, slug, unit_id, register_type, word_order, registers, constraint_ranges]

  RegisterRange:
    annotations:
      sql_table: register_range
    description: Named invalid / individual-read range on a map.
    slots: [node, range_type, start, end, note]
    slot_usage:
      start: { required: true }
      end: { required: true }

  ModbusRegister:
    annotations:
      sql_table: modbus_register
    description: >-
      One register → one measurand. The measurand link is the relational rewrite of grimoire's interval_item: FK to the feature row + the quantity/part/channel discriminators.
    slots:
      [
        node,
        address,
        quantity_kind,
        part,
        flow_direction,
        period,
        scale,
        decimals,
        unit,
        datatype,
        feature,
      ]
    slot_usage:
      datatype: { required: true }
      feature: { required: true }

  # ── device layer: ONE table ──
  # Rows are MODELS (manufacturer + model number); device_type says which kind
  # of device the model is. NO type-specific class lives here — that is the
  # invariant that keeps a new device type an INSERT: per-type classes exist
  # ONLY in the validation overlay, which gen-sqlddl never reads. Adding one
  # must leave gen-sqltables output byte-identical.
  DeviceModel:
    annotations:
      sql_table: device_model
    description: A catalogued device model — the assembly of feature-of-interest rows its type calls for.
    slots:
      [
        node,
        device_type,
        slug,
        product,
        contents,
        network_interfaces,
        services,
        register_map,
        ac_ports,
        dc_ports,
        environments,
      ]
    slot_usage:
      product: { required: true }
      device_type: { required: true }
