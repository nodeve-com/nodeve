# VALIDATION OVERLAY — GENERATED in the real cut, one stencil per FeatureType
# row + per device type × feature type socket binding; hand-written here to
# prove the stencil. Consumed ONLY by linkml-validate; gen-sqlddl reads the base
# schema (these classes would otherwise materialize as tables and fragment the
# uniform Interval/FeatureOfInterest ones).
# Parts are NOT projected: a part is a row of the owning feature, so its valid
# set is per-model and the FK already bounds it. Which parts a feature ought to
# have (three-phase → a/b/c) stays a bake check. Local Inverter redefinition
# shadows the base one over the import merge.
id: https://nodeve.dev/schema/energy/projected
name: nodeve-energy-projected
prefixes:
  linkml: https://w3id.org/linkml/
  nodeve: https://nodeve.dev/schema/energy/
  node: https://nodeve.dev/node/
default_prefix: nodeve
default_range: string
imports:
  - nodeve-energy

# ─── PROJECTED ENUMS ─────────────────────────────────────────────────────────
# ONE quantity enum per feature type — the union of its QuantityBinding rows,
# validated once on Interval (aspect flags stay a bake check); role vocabularies
# from the device type × feature type socket bindings.
enums:
  AcQuantity:
    permissible_values: { voltage: {}, electric_current: {}, frequency: {}, active_power: {}, reactive_power: {}, apparent_power: {}, active_energy: {} }
  DcQuantity:
    permissible_values: { voltage: {}, electric_current: {}, active_power: {} }
  EnvironmentQuantity:
    permissible_values: { temperature: {} }
  InverterAcPortRole:
    permissible_values: { in: {}, out: {}, grid: {}, load: {}, eps: {} }
  InverterDcPortRole:
    description: SOCKETS, not instances — three trackers are three part rows on the one pv-tracker feature.
    permissible_values: { pv-tracker: {}, battery: {} }
  InverterEnvironmentRole:
    permissible_values: { ambient: {}, enclosure: {} }

# ─── PROJECTED TYPE CLASSES ──────────────────────────────────────────────────
classes:
  AcPhaseInterval:
    is_a: Interval
    slot_usage:
      quantity_kind: { range: AcQuantity }
  AcPhasePort:
    is_a: FeatureOfInterest
    description: Phase count is the feature's part rows (a/b/c, l1/l2, or none) — never the type.
    slot_usage:
      intervals: { range: AcPhaseInterval }
      feature_type: { equals_string: node:feature-type/ac-phase }

  DcPortInterval:
    is_a: Interval
    slot_usage:
      quantity_kind: { range: DcQuantity }
  DcPort:
    is_a: FeatureOfInterest
    description: One row per socket (pv-tracker, battery); how many trackers is that feature's part rows.
    slot_usage:
      intervals: { range: DcPortInterval }
      feature_type: { equals_string: node:feature-type/dc-port }

  EnvironmentInterval:
    is_a: Interval
    slot_usage:
      quantity_kind: { range: EnvironmentQuantity }
  Environment:
    is_a: FeatureOfInterest
    description: >-
      What Enclosure was groping at — the thing that carries temperature (and
      later humidity, pressure). Partless: intervals sit on NULL.
    slot_usage:
      intervals: { range: EnvironmentInterval }
      feature_type: { equals_string: node:feature-type/environment }

  # ── device type × feature type socket classes — role as the socket
  # discriminator: every socket at-most-one row; required-ness per member
  # (out) is the bake-time presence check. ──
  InverterAcPhasePort:
    is_a: AcPhasePort
    slot_usage:
      role: { range: InverterAcPortRole }
  InverterDcPort:
    is_a: DcPort
    slot_usage:
      role: { range: InverterDcPortRole }
  InverterEnvironment:
    is_a: Environment
    slot_usage:
      role: { range: InverterEnvironmentRole }

  # The device-type stencil — NOT in the base schema, so it adds no table.
  # Pins device_type and carries the socket contract (required-ness, narrowed
  # ranges) that DeviceModel deliberately leaves open.
  Inverter:
    is_a: DeviceModel
    slot_usage:
      device_type: { equals_string: node:device-type/inverter }
      ac_ports: { required: true, range: InverterAcPhasePort }
      dc_ports: { required: true, range: InverterDcPort }
      environments: { range: InverterEnvironment }
