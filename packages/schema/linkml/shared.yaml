# Shared slot layer. Imported once by nodeve.yaml, beside enums.yaml.
# Object-valued slots range over classes DEFINED IN THE IMPORTER; LinkML
# resolves names over the merged import closure, so this file only stands
# alone alongside it.
id: https://nodeve.com/schema/lib/shared
name: shared
# prefixes live ONCE, on the aggregate root (nodeve.yaml) — the legacy
# SchemaLoader the SQL generators use resolves this file's CURIEs against the
# root's namespaces, so a local block would be the duplicate, not this absence
default_prefix: nodeve
default_range: string

# ─── SLOTS (grimoire properties) ─────────────────────────────────────────────
# One definition per field name, schema-wide — the global-by-default invariant
# grimoire hand-enforces is LinkML's native behaviour. Classes refine locally
# via slot_usage without forking the definition.
slots:
  flow_direction:
    range: FlowDirection
    title: Flow direction
    exact_mappings: [ cim:FlowDirectionKind ]
    annotations: { camel: flowDirection }
  # THE ONE part discriminator, and the path's part segment verbatim. A `*` row
  # is stored as-is and resolved against the OWNING feature's part_set members
  # (or count) at query time. The slug pattern produces neither marker, so
  # neither can collide with an authored part.
  part:
    range: string
    title: Part
    related_mappings: [ schema:hasPart ]
    pattern: '^([a-z0-9]+(-[a-z0-9]+)*|_|\*)$'
    description: "Which part of the feature this row applies to — a member slug names one part (a phase leg, a circuit, a tracker position). `_` is the whole feature (some quantities are only ever combined, like frequency); `*` is the default, applied to each part that doesn't state its own."
    annotations: { i18n: { value: { title: { pt: Parte } } } }
  period: { range: Period, title: Period, exact_mappings: [ cim:MacroPeriodKind ] }
  role:
    range: string
    title: Role
    exact_mappings: [ schema:Role ]
    description: 'which SOCKET of the node type this feature row fills — one vocabulary member per feature (out, grid, pv-tracker, battery, ambient, …), at-most-one row each; classes narrow to the node type × feature type role enum. Doubles as the feature slug. Repetition WITHIN a socket is parts, not roles: three trackers = one pv-tracker feature whose intervals carry part keys 1/2/3.'
  serial_number:
    range: string
    title: Serial number
    exact_mappings: [ schema:serialNumber ]
    description: "the manufacturer's per-unit serial — the physical unit's identity at a site, distinct from the model's catalog slug/code"
    annotations: { camel: serialNumber }
  # wire/HA form (snake) derives mechanically (s/-/_/); renamable — code is the stable ref
  slug:
    range: string
    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    title: Slug
    related_mappings: [ schema:identifier ]
    description: 'Hand-authored machine key and URL segment, in kebab-case.'
    annotations:
      i18n:
        value:
          title: { pt: Slug }
          lede: { pt: 'Identificador de máquina e segmento de URL, escrito à mão em kebab-case.' }
  unit:
    range: string
    title: Unit
    exact_mappings: [ qudt:unit ]
    description: "non-SI unit override of a stated value — only when the value isn't in the quantity kind's canonical SI unit (kW vs W, °C vs K); omit ⇒ SI unit"
    annotations: { i18n: { value: { title: { pt: Unidade } } } }
  contents:
    range: Content
    multivalued: true
    inlined_as_list: true
    title: Contents
    related_mappings: [ schema:text ]
  # FK to a catalogued device node — the pointer a site adapter (what it reads)
  # and a site inventory item (what it is) both use. Grimoire's catalog_item
  # {archetype_id, slug} composite collapses to one Node FK here.
  device:
    range: SubjectNode
    title: Device
    exact_mappings: [ sosa:hasFeatureOfInterest ]
    description: 'FK — the metered catalogued subject node this row points at'
  feature_type:
    range: FeatureType
    title: Feature type
    related_mappings: [ sosa:ObservableProperty ]
    description: FK — which feature definition this row instantiates
    annotations: { camel: featureType }
  node:
    identifier: true
    range: Node
    title: Node
    related_mappings: [ schema:identifier ]
    description: "PK + FK to Node — every row's identity IS its Node row; the one permalink space"
  quantity_kind:
    range: QuantityKind
    required: true
    title: Quantity kind
    exact_mappings: [ qudt:hasQuantityKind ]
    description: 'FK to the quantity_kind table — the bulk-loaded QUDT master list. Membership is the FK, not an enum: a new kind is an INSERT'
    annotations: { camel: quantityKind }

# ─── ENUMS ────────────────────────────────────────────────────────────────────
# CLOSED GRAMMAR vocabularies only. Part keys (phase a/b/c, l1/l2, tracker
# positions) are per-model discriminators on Interval, validated against a
# feature's part_set or count — never a new column or a DDL migration.
enums:
  FlowDirection:
    title: Flow direction
    permissible_values:
      in:
        title: Import
        meaning: cim:FlowDirectionKind.forward
        annotations: { i18n: { value: { title: { pt: Importar } } } }
      out:
        title: Export
        meaning: cim:FlowDirectionKind.reverse
        annotations: { i18n: { value: { title: { pt: Exportar } } } }
      net:
        title: Net
        meaning: cim:FlowDirectionKind.net
        annotations: { i18n: { value: { title: { pt: Líquido } } } }
  Period:
    title: Period
    permissible_values:
      daily:
        title: Daily
        meaning: cim:MacroPeriodKind.daily
        close_mappings: [ iso-8601:P1D ]
        annotations: { i18n: { value: { title: { pt: Diário } } } }
      monthly:
        title: Monthly
        meaning: cim:MacroPeriodKind.monthly
        close_mappings: [ iso-8601:P1M ]
        annotations: { i18n: { value: { title: { pt: Mensal } } } }
      yearly:
        title: Yearly
        close_mappings: [ iso-8601:P1Y ]
        annotations: { i18n: { value: { title: { pt: Anual } } } }
      lifetime:
        title: Lifetime
        related_mappings: [ wikidata:Q1675349 ]
        annotations: { i18n: { value: { title: { pt: Vitalício } } } }
