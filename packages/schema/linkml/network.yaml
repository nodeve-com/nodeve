id: https://nodeve.com/schema/lib/network
name: network
default_prefix: nodeve
default_range: string
classes:
  NetworkInterface:
    title: Network interface
    annotations: { sql_table: network_interface, keyed_by: slug }
    slots: [ node, interface_type, link_speed, mac_address ]
    slot_usage: { interface_type: { required: true } }

  # One address the NIC answers on — its own row, not a NIC column: a interface
  # carries several (v4 + v6, a service alias). The address IS the key, so the
  # node segment is its slugified form; `fqdn` is the name that resolves to it.
  IpBinding:
    title: IP binding
    annotations: { sql_table: ip_binding, keyed_by: ip_address }
    description: One address bound to a network interface, with the name that resolves to it.
    slots: [ node, ip_address, network_interface, fqdn ]
    slot_usage: { ip_address: { required: true }, network_interface: { required: true } }

  # A service surface. A LOCAL one binds a NIC of the node offering it (the
  # inverter's modbus-tcp on eth0); a REMOTE one (a broker, an eKuiper REST API)
  # names its `host` instead — the peer is reached, not owned, so it has no NIC
  # here. Exactly one of the two, which no relational constraint states.
  ServiceBinding:
    title: Service binding
    annotations: { sql_table: service_binding, keyed_by: slug }
    slots: [ node, port, service_protocol, network_interface, host ]
    slot_usage: { service_protocol: { required: true } }
slots:
  fqdn:
    range: string
    title: Fully-qualified domain name
    related_mappings: [ schema:alternateName ]
    description: 'the DNS name that resolves to this address'
  interface_type:
    range: InterfaceType
    title: Interface type
    related_mappings: [ wikidata:Q985806 ]
    annotations: { camel: interfaceType }
  ip_address:
    range: string
    title: IP address
    related_mappings: [ schema:identifier ]
    description: 'the bound address, v4 or v6, as dotted-quad / colon-hex text'
    annotations: { camel: ipAddress }
  link_speed:
    range: integer
    title: Link speed
    close_mappings: [ wikidata:Q194158 ]
    description: 'negotiated line rate of the interface, in megabits per second (10 / 100 / 1000 / …)'
    annotations: { camel: linkSpeed }
  mac_address:
    range: string
    title: MAC address
    related_mappings: [ schema:identifier ]
    description: "the interface's hardware address — lowercase colon-separated octets"
    annotations: { camel: macAddress }
  port:
    range: integer
    title: Port
    exact_mappings: [ wikidata:Q858321 ]
    description: "TCP/UDP port number; omit to fall back to the scheme's well-known default"
  service_protocol:
    range: ServiceProtocol
    title: Service protocol
    close_mappings: [ wikidata:Q132364 ]
    annotations: { camel: serviceProtocol }
  network_interface:
    range: NetworkInterface
    title: Network interface
    exact_mappings: [ wikidata:Q985806 ]
    annotations: { camel: networkInterface }

# ─── ENUMS ────────────────────────────────────────────────────────────────────
# CLOSED GRAMMAR vocabularies only. Part keys (phase a/b/c, l1/l2, tracker
# positions) are per-model discriminators on Interval, validated against a
# feature's part_set or count — never a new column or a DDL migration.
enums:
  InterfaceType:
    title: Interface type
    permissible_values:
      async_serial:
        title: Asynchronous serial port
        meaning: iana-iftype:rs232
        annotations: { i18n: { value: { title: { pt: Porta serial assíncrona } } } }
      can:
        title: CAN bus
        meaning: iso-11898:11898-1
        annotations: { i18n: { value: { title: { pt: Barramento CAN } } } }
      ethernet_csmacd:
        title: Ethernet
        meaning: iana-iftype:ethernetCsmacd
        annotations: { i18n: { value: { title: { pt: Ethernet } } } }
      ieee80211:
        title: WiFi
        meaning: iana-iftype:ieee80211
        annotations: { i18n: { value: { title: { pt: WiFi } } } }
      usb:
        title: USB
        meaning: iana-iftype:usb
        annotations: { i18n: { value: { title: { pt: USB } } } }
  ServiceProtocol:
    title: Service protocol
    permissible_values:
      http:
        title: HTTP
        meaning: iana-uri-scheme:http
        annotations: { i18n: { value: { title: { pt: HTTP } } } }
      https:
        title: HTTPS
        meaning: iana-uri-scheme:https
        annotations: { i18n: { value: { title: { pt: HTTPS } } } }
      ws:
        title: WebSocket
        meaning: iana-uri-scheme:ws
        annotations: { i18n: { value: { title: { pt: WebSocket } } } }
      wss:
        title: WebSocket (TLS)
        meaning: iana-uri-scheme:wss
        annotations: { i18n: { value: { title: { pt: WebSocket (TLS) } } } }
      mqtt:
        title: MQTT
        meaning: iana-uri-scheme:mqtt
        annotations: { i18n: { value: { title: { pt: MQTT } } } }
      mqtts:
        title: MQTT (TLS)
        meaning: iana-uri-scheme:mqtts
        annotations: { i18n: { value: { title: { pt: MQTT (TLS) } } } }
      modbus_tcp:
        title: Modbus TCP
        meaning: modbus-org:Modbus-TCP
        annotations: { i18n: { value: { title: { pt: Modbus TCP } } } }
