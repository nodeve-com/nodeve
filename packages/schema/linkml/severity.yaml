id: https://nodeve.com/schema/lib/severity
name: severity
default_prefix: nodeve
default_range: string

enums:
  Severity:
    title: Severity
    permissible_values:
      best:
        title: Best
        close_mappings: [ iso-25012:Exemplary ]
        annotations: { i18n: { value: { title: { pt: Ótimo } } } }
      better:
        title: Better
        close_mappings: [ iso-25012:Managed ]
        annotations: { i18n: { value: { title: { pt: Melhor } } } }
      good:
        title: Good
        close_mappings: [ iso-25012:Acceptable ]
        annotations: { i18n: { value: { title: { pt: Bom } } } }
      nominal:
        title: Nominal
        close_mappings: [ vim:1.26 ]
        annotations: { i18n: { value: { title: { pt: Nominal } } } }
      notice:
        title: Notice
        meaning: rfc-5424:Notice
        exact_mappings: [ isa-18-2:Low ]
        annotations: { i18n: { value: { title: { pt: Aviso } } } }
      caution:
        title: Caution
        meaning: isa-18-2:Medium
        annotations: { i18n: { value: { title: { pt: Cautela } } } }
      warning:
        title: Warning
        meaning: rfc-5424:Warning
        exact_mappings: [ isa-18-2:High ]
        annotations: { i18n: { value: { title: { pt: Alerta } } } }
      critical:
        title: Critical
        meaning: rfc-5424:Critical
        exact_mappings: [ isa-18-2:Critical ]
        annotations: { i18n: { value: { title: { pt: Crítico } } } }
      fatal:
        title: Fatal
        close_mappings: [ rfc-5424:Emergency ]
        annotations: { i18n: { value: { title: { pt: Fatal } } } }
