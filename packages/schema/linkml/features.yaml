id: https://nodeve.com/schema/lib/features
name: features

default_prefix: nodeve
default_range: string
classes:
  # ── feature layer: reusable tables ──
  # The valued-range table (grimoire features/valued_range.yaml): one
  # distinguished point + the band around it — absolute (tolerance) and
  # relative (margin) families, symmetric + asymmetric. A width facet of
  # Interval: its own table, sharing the interval's node.
  ValuedRange:
    title: Valued range
    annotations: { sql_table: valued_range }
    description: >-
      A single point (value) plus the tolerated band around it (min/max OPTIONAL — value-only, one-sided, or full all legal; never fabricate a band). Quantity-agnostic: the owning row supplies the quantity; unit stays here with the numbers it scales.
    slots:
      - node
      - min
      - max
      - value
      - unit
      - tolerance
      - tolerance_lower
      - tolerance_upper
      - margin
      - margin_lower
      - margin_upper

  # Interval is the ONE quantity-band table — every quantity assertion on a
  # feature is an Interval row; quantity admissibility is validated HERE, once.
  # Specification / Measurement are 1:1 WIDTH EXTENSIONS sharing the interval's
  # node row (the Product-on-SubjectNode trick) — narrow tables, no repeated
  # core columns. Uniqueness: one row per (feature, quantity_kind, part, slug).
  Interval:
    title: Interval
    annotations:
      sql_table: interval
      # authored form: three stacked map levels, one key per listed slot —
      # part → quantity → interval slug assemble ONE row
      keyed_by: part quantity_kind slug
      # the slug is authored but EARNED: a `-`-joined ordered subsequence of the
      # values these facets actually set. None set ⇒ `_` (docs/intervals.md)
      discriminates: specification measurement
    description: >-
      One quantity band on one feature. part `_` = combined; slug discriminates multiple rows per (quantity_kind, part). Aspect payloads hang off as width extensions — THEY point here (shared node), never back.
    slots: [ node, quantity_kind, valued_range, part ]
    slot_usage:
      # part is the discriminator that stays a column; the interval slug is the
      # node's leaf (on the node row), not repeated here.
      part: { required: true }

  Specification:
    title: Specification
    # duration/trigger_on shape the band, they don't say WHICH band — no slug claim
    annotations: { sql_table: specification, discriminates: zone rating severity conditions }
    description: >-
      BEHAVIOURAL payload — spec rating, operating zone, severity tier, or condition-gated derate. Shares its interval's node row.
    slots: [ node, conditions, rating, zone, severity, duration, trigger_on ]

  Measurement:
    title: Measurement
    # resolution is precision, not identity — no slug claim
    annotations: { sql_table: measurement, discriminates: flow_direction period }
    description: >-
      MEASURABLE-channel payload — what a sensor reports: resolution and the energy-channel discriminators. Shares its interval's node row.
    slots: [ node, flow_direction, period, resolution ]

  # No `discriminates`: conditioning is not identity. A band named for its filter
  # would be named for its plumbing, and the same band conditioned two ways is
  # one band — so Filter earns no slug word, exactly like ValuedRange.
  Filter:
    title: Filter
    annotations: { sql_table: filter }
    description: >-
      INPUT CONDITIONING the band claims over — the band asserts the conditioned signal, not raw samples (a 1 s mean holds inside a margin that 5 Hz samples spike out of). Shares its interval's node row. Absent ⇒ the band claims the raw stream.
    slots: [ node, throttle_average_ms ]

  Condition:
    title: Condition
    # a gate's OWN value can name the band it gates (nominal-br-220v-60hz). The
    # `interval` anchor cannot: it is another band's slug, and borrowing it reads
    # as a local axis (`continuous-intermittent` looks like two ratings).
    annotations: { sql_table: condition, discriminates: equals test_condition }
    description: >-
      One condition a specification holds under — either a commissioning-setting equality or a pointer at another interval (the derate anchor). All values are FKs assembled from authored coordinates; a typo dies at the database's FK gate.
    slots: [ node, setting, equals, interval, test_condition ]

  FeatureOfInterest:
    title: Feature of interest
    annotations:
      sql_table: feature_of_interest
      # authored form: feature_of_interest: {<type>: {<role>: …}} — two levels
      keyed_by: feature_type role
    abstract: true
    close_mappings: [ sosa:FeatureOfInterest ]
    description: >-
      The ONE feature table (SOSA feature-of-interest): a named attachment point that refines all possible measurands to a known admissible set — a temperature attaches to an environment row exactly as a voltage attaches to a port row. role IS the socket name (out, grid, pv-tracker, battery, ambient) — one row per socket. Repetition within a socket is PARTS, not rows: three trackers = one pv-tracker feature whose intervals carry part keys 1/2/3. A part is a per-model discriminator on Interval (a/b/c, l1/l2, 1/2/3), validated against part_set or count — not its own table; part `_` on an interval = combined, the whole feature.
    slots:
      - node
      - feature_type
      - role
      - part_set
      - count
      - intervals
      - specifications
      - measurements
      - filters
    slot_usage: { role: { required: true }, feature_type: { required: true } }
slots:
  count:
    range: integer
    minimum_value: 1
    title: Count
    exact_mappings: [ schema:numberOfItems ]
    description: 'cardinality subdivision — n of the same thing; part keys must be 1…n. Exclusive with part_set; both absent = no parts'
  duration:
    range: float
    title: Duration
    description: 'how long the quantity may sit inside this band, seconds — absent means unbounded in time (a continuous rating); float, because debounce windows are milliseconds'
    close_mappings: [ cim:OperationalLimitType.acceptableDuration ]
    annotations: { i18n: { value: { title: { pt: Duração } } } }
  margin:
    range: float
    title: Margin
    related_mappings: [ wikidata:Q950292 ]
    description: symmetric RELATIVE band (±0.05 = ±5%)
  margin_lower:
    range: float
    title: Margin lower
    related_mappings: [ wikidata:Q950292 ]
    description: 'asymmetric RELATIVE below; fraction_lower sugar desugars into this'
    annotations: { camel: marginLower }
  margin_upper:
    range: float
    title: Margin upper
    related_mappings: [ wikidata:Q950292 ]
    description: 'asymmetric RELATIVE above; fraction_upper sugar desugars into this'
    annotations: { camel: marginUpper }
  max:
    range: float
    title: Maximum
    exact_mappings: [ schema:maxValue ]
    description: "inclusive high end of a closed interval, in the enclosing row's unit"
    annotations: { i18n: { value: { title: { pt: Máximo } } } }
  min:
    range: float
    title: Minimum
    exact_mappings: [ schema:minValue ]
    description: "inclusive low end of a closed interval, in the enclosing row's unit"
    annotations: { i18n: { value: { title: { pt: Mínimo } } } }
  resolution:
    range: float
    title: Resolution
    description: "quantization step, in the measurement's unit — smallest distinguishable change (VIM 4.14); omit when the datasheet doesn't state it, never fabricate"
    exact_mappings: [ 'vim:4.14', ssn-system:Resolution ]
  throttle_average_ms:
    range: integer
    minimum_value: 1
    title: Throttle average (ms)
    related_mappings: [ schema:Duration ]
    description: 'window the input is averaged over before the band is tested, integer milliseconds — a claim about the conditioned signal, not a sampling rate'
    annotations: { camel: throttleAverageMs }
  tolerance:
    range: float
    title: Tolerance
    related_mappings: [ wikidata:Q950292 ]
    description: 'symmetric ABSOLUTE band (±200, in unit)'
  tolerance_lower:
    range: float
    title: Tolerance lower
    related_mappings: [ wikidata:Q950292 ]
    description: 'asymmetric ABSOLUTE below (low edge = value − tolerance_lower); pairs with tolerance_upper'
    annotations: { camel: toleranceLower }
  tolerance_upper:
    range: float
    title: Tolerance upper
    related_mappings: [ wikidata:Q950292 ]
    description: 'asymmetric ABSOLUTE above (high edge = value + tolerance_upper); pairs with tolerance_lower'
    annotations: { camel: toleranceUpper }
  value:
    range: float
    title: Value
    description: 'the magnitude of a valued quantity, in the stated unit — alone an exact point; with a band (tolerance/margin/min/max) the designated centre that band sits around'
    close_mappings: [ qudt:Quantity ]
    annotations: { i18n: { value: { title: { pt: Valor } } } }
  conditions:
    range: Condition
    multivalued: true
    inlined_as_list: true
    title: Conditions
    description: 'the conditions under which this specification holds — ALL must hold (AND); each is one Condition row'
    close_mappings: [ 'ssn-system:inCondition', 'vim:4.9' ]
  equals:
    range: DomainMember
    title: Equals
    related_mappings: [ wikidata:Q609647 ]
    description: 'FK — the member the gated setting must hold for the band to apply; one value per gate — a band valid for several values is several bands (OR = separate bands)'
  filters:
    range: Filter
    multivalued: true
    inlined_as_list: true
    title: Filters
    related_mappings: [ ssn-system:Condition ]
    description: "filter width-extension rows — each shares its interval's node"
  intervals:
    range: Interval
    multivalued: true
    inlined_as_list: true
    title: Intervals
    related_mappings: [ wikidata:Q233991 ]
  measurements:
    range: Measurement
    multivalued: true
    inlined_as_list: true
    title: Measurements
    related_mappings: [ sosa:Observation ]
    description: "measurement width-extension rows — each shares its interval's node"
  part_set:
    range: PartSet
    title: Part set
    related_mappings: [ skos:Collection ]
    description: "FK — the named closed set this feature's part keys must belong to. Exclusive with count"
    annotations: { camel: partSet }
  rating: { range: Rating, title: Rating, close_mappings: [ cim:OperationalLimitType ] }
  setting:
    range: Setting
    title: Setting
    related_mappings: [ wikidata:Q1413083 ]
    description: 'FK — the commissioning knob this gate tests'
  severity: { range: Severity, title: Severity, related_mappings: [ isa-18-2:Priority ] }
  specifications:
    range: Specification
    multivalued: true
    inlined_as_list: true
    title: Specifications
    close_mappings: [ cim:OperationalLimitType ]
    description: "specification width-extension rows — each shares its interval's node"
  test_condition:
    range: TestCondition
    title: Test condition
    related_mappings: [ 'vim:2.7' ]
    description: 'datasheet condition axis — the band applies only when measured under this test condition (bifacial rear-irradiance gains); a plain enum value, not an FK'
    annotations: { camel: testCondition }
  trigger_on:
    range: TriggerOn
    title: Trigger on
    related_mappings: [ schema:greater ]
    description: 'which side turns a stateful zone ON — below ⇒ ON under min, OFF above max; above ⇒ the reverse; between the edges the state HOLDS (the [min,max] deadband is what makes it stateful)'
    annotations: { camel: triggerOn, i18n: { value: { title: { pt: Aciona em } } } }
  valued_range:
    range: ValuedRange
    inlined: true
    title: Valued range
    related_mappings: [ schema:QuantitativeValue ]
    description: FK — the point + band this row states
    annotations: { camel: valuedRange }
  zone: { range: Zone, title: Zone, related_mappings: [ saref:State ] }
