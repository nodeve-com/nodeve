# Slot + enum layer of the nodeve schema — imported by nodeve.yaml.
# Object-valued slots range over classes DEFINED IN THE IMPORTER; LinkML
# resolves names over the merged import closure, so this file only stands
# alone alongside it.
id: https://nodeve.com/schema/slots
name: nodeve-slots
prefixes:
  skos: http://www.w3.org/2004/02/skos/core#
  linkml: https://w3id.org/linkml/
  nodeve: https://nodeve.com/schema/
  node: https://nodeve.com/node/
  qudt: http://qudt.org/schema/qudt/
  schema: https://schema.org/
default_prefix: nodeve
default_range: string
imports:
  - linkml:types

# ─── ENUMS ────────────────────────────────────────────────────────────────────
# CLOSED GRAMMAR vocabularies only (rating, severity, …) live here as
# schema enums. Part vocabularies (phase a/b/c, l1/l2, tracker positions) are
# Part ROWS on the feature — per-model, so a new subdivision is a new row,
# never a new column or a DDL migration.
enums:
  FlowDirection:
    permissible_values: { in: {}, out: {}, net: {} }
  InterfaceType:
    permissible_values: { ethernet_csmacd: {}, ieee80211: {} }
  MatchStrength:
    description: SKOS mapping strength — closed grammar, so an enum and not a table.
    permissible_values:
      exact: { meaning: skos:exactMatch }
      close: { meaning: skos:closeMatch }
      broad: { meaning: skos:broadMatch }
      narrow: { meaning: skos:narrowMatch }
      related: { meaning: skos:relatedMatch }
  PartScope:
    description: >-
      Disambiguates a spec whose interval carries NULL part: combined = the whole feature, default = fallback for every member with no own row. Resolved at query time, never expanded into rows — the member list lives on FeatureType, so a baked expansion goes stale when a part is added.
    permissible_values: { member: {}, combined: {}, default: {} }
  Period:
    permissible_values: { daily: {} }
  Rating:
    permissible_values:
      continuous: {}
      intermittent: {}
      short_term: {}
      startup: {}
      shutdown: {}
      survival: {}
      protection_required: {}
  RegisterDatatype:
    permissible_values: { uint16: {}, int16: {}, uint32: {}, int32: {} }
  RegisterType:
    permissible_values: { holding: {}, input: {} }
  ServiceProtocol:
    permissible_values: { modbus_tcp: {}, https: {}, http: {}, mqtt: {} }
  Severity:
    permissible_values: { best: {}, better: {}, good: {}, nominal: {}, notice: {}, caution: {}, warning: {}, critical: {}, fatal: {} }
  TriggerOn:
    permissible_values: { above: {}, below: {} }
  WordOrder:
    permissible_values: { high_first: {}, low_first: {} }
  Zone:
    permissible_values: { mppt: {}, mpp: {}, open_circuit: {}, off: {}, idle: {}, running: {} }

# ─── SLOTS (grimoire properties) ─────────────────────────────────────────────
# One definition per field name, schema-wide — the global-by-default invariant
# grimoire hand-enforces is LinkML's native behaviour. Classes refine locally
# via slot_usage without forking the definition.
slots:
  accumulation: { range: string, description: 'instantaneous | cumulative — upstream measurand fact, carried not re-derived' }
  address: { range: integer, required: true }
  body: {}
  code: { range: string, description: '8-char Crockford human handle DERIVED from the permalink''s hash tail (40 bits); minted with the row, never recomputed' }
  datatype: { range: RegisterDatatype }
  decimals: { range: integer }
  deprecated: { range: boolean, description: 'upstream retired this term. The row STAYS — existing refs still point at it and the URI still resolves; it is superseded, not absent' }
  deprecated_in: { range: string, description: 'upstream version that retired it (QUDT "3.1.11")', annotations: { camel: deprecatedIn } }
  duration: { range: integer, description: seconds }
  end: { range: integer }
  equals: {}
  flow_direction: { range: FlowDirection, annotations: { camel: flowDirection } }
  interface_type: { range: InterfaceType, annotations: { camel: interfaceType } }
  iri_template: { range: string, description: 'resolves a term to its IRI — {id} is the term slot (http://qudt.org/property/quantitykind/{id}); absent when the registry has no resolvable form', annotations: { camel: iriTemplate } }
  language: { range: string, required: true, slot_uri: schema:inLanguage, description: 'BCP 47 language tag' }
  lede: { description: short description }
  link_speed: { range: integer, annotations: { camel: linkSpeed } }
  margin: { range: float, description: symmetric RELATIVE band (±0.05 = ±5%) }
  margin_lower: { range: float, description: 'asymmetric RELATIVE below; fraction_lower sugar desugars into this', annotations: { camel: marginLower } }
  margin_upper: { range: float, description: 'asymmetric RELATIVE above; fraction_upper sugar desugars into this', annotations: { camel: marginUpper } }
  match: { range: MatchStrength, required: true }
  max: { range: float }
  measurable: { range: boolean, description: 'binding aspect flag — the feature type admits MEASUREMENT rows of this quantity (daily energy measured never specced)' }
  min: { range: float }
  model: {}
  note: {}
  ordinal: { range: integer, minimum_value: 1, description: 'sort/join key of a part row' }
  part_scope: { range: PartScope, required: true, description: 'SPECIFICATION-only — which parts this spec reaches. member = its interval''s part row; combined = the whole feature; default = every member without its own row. member ⟺ the interval''s part is present. Injected by format.ts from part nullity — only `default` is hand-authored.', annotations: { camel: partScope } }
  period: { range: Period }
  port: { range: integer }
  range_type: { range: string, description: invalid | individual_read, annotations: { camel: rangeType } }
  rating: { range: Rating }
  register_type: { range: RegisterType, annotations: { camel: registerType } }
  required: { range: boolean, description: 'socket binding — the device type must carry a feature row for this role' }
  resolution: { range: float }
  role: { range: string, description: 'which SOCKET of the device type this feature row fills — one vocabulary member per feature (out, grid, pv-tracker, battery, ambient, …), at-most-one row each; classes narrow to the device type × feature type role enum. Doubles as the feature slug. Repetition WITHIN a socket is parts, not roles: three trackers = one pv-tracker feature with three part rows.' }
  scale: { range: float }
  series: {}
  service_protocol: { range: ServiceProtocol, annotations: { camel: serviceProtocol } }
  setting_key: { annotations: { camel: settingKey } }
  severity: { range: Severity }
  si_unit: { range: string, description: 'SI unit of the kind; an interval overrides per-row via `unit`', annotations: { camel: siUnit } }
  slug: { range: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', description: 'hand-authored machine key + url segment, kebab-case; wire/HA form (snake) derives mechanically (s/-/_/); renamable — code is the stable ref' }
  slug_qualified: { identifier: true, range: uriorcurie, description: 'permalink PK — node:<archetype>/<slug path> CURIE minted from the qualified slug trail. A creation-time fact: renames/re-filing do NOT re-derive it', annotations: { camel: slugQualified } }
  spec: { range: boolean, description: 'binding aspect flag — the feature type admits SPECIFICATION rows of this quantity (survival voltage specced never measured)' }
  start: { range: integer }
  term: { range: string, required: true, description: 'the identifier AS the registry spells it (Q25428, ActivePower, voltage) — never normalized' }
  title: {}
  tolerance: { range: float, description: 'symmetric ABSOLUTE band (±200, in unit)' }
  tolerance_lower: { range: float, annotations: { camel: toleranceLower } }
  tolerance_upper: { range: float, annotations: { camel: toleranceUpper } }
  trigger_on: { range: TriggerOn, annotations: { camel: triggerOn } }
  unit: { range: string, description: only when not the feature type's SI unit }
  unit_id: { range: integer, annotations: { camel: unitId } }
  url: { range: uri, description: registry homepage }
  value: { range: float }
  word_order: { range: WordOrder, annotations: { camel: wordOrder } }
  zone: { range: Zone }
  # object-valued slots — FKs / owned row sets; global like everything else,
  # classes narrow via slot_usage only when the shared def is too loose
  about: { range: Node, required: true, slot_uri: schema:about, description: 'the node this content describes' }
  ac_ports: { range: FeatureOfInterest, multivalued: true, inlined_as_list: true, description: 'AC port ROWS — which socket each fills lives in its role, never a column name; phase count is the feature''s part rows (a/b/c, l1/l2, or none), never the type', annotations: { camel: acPorts } }
  broader: { range: QuantityKind, description: 'self-FK — upstream hierarchy (active_power broader electric_power)' }
  conditions: { range: Condition, multivalued: true, inlined_as_list: true }
  constraint_ranges: { range: RegisterRange, multivalued: true, inlined_as_list: true, annotations: { camel: constraintRanges } }
  contents: { range: Content, multivalued: true, inlined_as_list: true }
  dc_ports: { range: FeatureOfInterest, multivalued: true, inlined_as_list: true, description: 'DC port ROWS — one per socket (pv-tracker, battery); how MANY trackers or battery ports is that feature''s part rows', annotations: { camel: dcPorts } }
  device_type: { range: DeviceType, description: 'FK — which device type this model is (inverter, dehumidifier, ac-meter). A ROW, not a class CURIE: a new device type is an INSERT, never a DDL migration. Permalink root = its slug', annotations: { camel: deviceType } }
  environments: { range: FeatureOfInterest, multivalued: true, inlined_as_list: true, description: 'environment ROWS — the things a temperature/humidity reading attaches to; role says which (ambient = rated operating conditions, enclosure = internal sensor)' }
  feature: { range: FeatureOfInterest, description: FK — which feature-of-interest row this reads }
  feature_type: { range: FeatureType, description: FK — which feature definition this row instantiates, annotations: { camel: featureType } }
  gated_by: { range: Interval, description: FK to the anchoring interval row, annotations: { camel: gatedBy } }
  intervals: { range: Interval, multivalued: true, inlined_as_list: true }
  manufacturer: { range: Manufacturer }
  measurements: { range: Measurement, multivalued: true, inlined_as_list: true, description: 'measurement width-extension rows — each shares its interval''s node' }
  network_interface: { range: NetworkInterface, annotations: { camel: networkInterface } }
  network_interfaces: { range: NetworkInterface, multivalued: true, inlined_as_list: true, annotations: { camel: networkInterfaces } }
  node: { identifier: true, range: Node, description: 'PK + FK to Node — every row''s identity IS its Node row; the one permalink space' }
  part: { range: Part, description: 'THE ONE part discriminator — FK to a part row of the OWNING feature (a phase leg, a circuit, a tracker position). NULL = combined (the whole), and some quantities are only ever combined (frequency).' }
  parts: { range: Part, multivalued: true, inlined_as_list: true, description: 'how THIS feature subdivides — a, b, c for three-phase; l1, l2 for split; 1, 2, 3 for trackers. Zero rows = combined only. Per-model, because models differ' }
  product: { range: Product, inlined: true }
  quantity_bindings: { range: QuantityBinding, multivalued: true, inlined_as_list: true, description: 'one row per feature type × quantity with aspect flags — replaces the two admissible-set slots', annotations: { camel: quantityBindings } }
  quantity_kind: { range: QuantityKind, required: true, description: 'FK to the quantity_kind table — the bulk-loaded QUDT master list. Membership is the FK, not an enum: a new kind is an INSERT', annotations: { camel: quantityKind } }
  refs: { range: Ref, multivalued: true, inlined_as_list: true, description: 'external-registry mappings for the row — the ONE way any row links out. Downstream (wikidata, HA) reads these' }
  register_map: { range: RegisterMap, inlined: true, description: 'FK to the shared family map — inlined only for the single-file example', annotations: { camel: registerMap } }
  registers: { range: ModbusRegister, multivalued: true, inlined_as_list: true }
  registry: { range: Registry, required: true, description: 'FK — which external registry the term belongs to' }
  replaced_by: { range: QuantityKind, description: 'self-FK — the current kind upstream redirects to (Conductivity → ElectricConductivity)', annotations: { camel: replacedBy } }
  services: { range: ServiceBinding, multivalued: true, inlined_as_list: true }
  socket_bindings: { range: SocketBinding, multivalued: true, inlined_as_list: true, description: 'the device type''s socket contract AS ROWS — which feature type fills which role. Projects to the role enums and required-ness the overlay validates', annotations: { camel: socketBindings } }
  specifications: { range: Specification, multivalued: true, inlined_as_list: true, description: 'specification width-extension rows — each shares its interval''s node' }
  valued_range: { range: ValuedRange, inlined: true, description: FK — the point + band this row states, annotations: { camel: valuedRange } }
