# @nodeve/checks — the org's Vale house rules (the prose engine of the gate). The
# TS checks run through `nodeve-check`; prose runs through the `vale` binary. Both
# are the commit gate; this file is the Vale half.
#
# THIS file IS the config every repo runs — the shared lefthook `vale` job invokes
# `vale --config=node_modules/@nodeve/checks/.vale.ini`, so NO repo authors its own
# `.vale.ini`. Turning on = extending `lefthook.checks.yml`; there is no per-repo
# opt-in step to forget. `StylesPath` resolves relative to THIS file, so it points
# at the styles vendored beside it — `nodeve/` (versioned here) plus `write-good/`
# and `proselint/` (committed, not `vale sync`-ed at consume time). Offline, self-
# contained: bump @nodeve/checks to change a rule everywhere.
#
# `Packages` is here only so a maintainer can re-run `vale sync` to refresh the
# vendored third-party styles; consumers never sync.

StylesPath = styles
Packages = write-good, proselint

[*.md]
BasedOnStyles = nodeve, write-good, proselint

# BLOCK on fat. Vale fails a commit ONLY on `error`; warning/suggestion are
# advisory. Wordy phrases + weasel/filler words, plus the copula-padding the
# telegraphic house style strips: passive voice and existential "there is/are".
write-good.TooWordy = error
write-good.Weasel = error
write-good.Passive = error
write-good.ThereIs = error
proselint.Very = error

# Filler: low-value phrases that survive TooWordy/Weasel — "in order to", "note
# that", "make sure to" (instruction narration). Cut, meaning survives.
nodeve.Filler = error

# Hedging: proselint's vague-language weasels + nodeve's deferred-decision hedges
# ("if wanted") — punting a call the doc should make.
proselint.Hedging = error
nodeve.Hedging = error

# Ephemeral state: words framing the doc's moment as transient ("uncommitted",
# "this session"). Docs persist past commit — these go stale on land.
nodeve.Ephemeral = error

# Narration: prose addressing a PRIOR version ("used to", "no longer", "RESOLVED",
# "correction:"). A doc is read fresh — history the reader never saw.
nodeve.Narration = error

# Every rule BLOCKS. A warning is a rule nobody obeys — if it's worth flagging it's
# worth failing, else cut it. Long sentences, clichés, and leftover TODO/FIXME
# markers all fail the gate like the rest.
nodeve.SentenceLength = error
proselint.Cliches = error
proselint.Annotations = error

# OFF — false positives on technical docs: E-Prime flags every "to be" verb; So
# bans sentence-initial "So"; Typography rewrites hex like 0x1510 to the × symbol.
write-good.E-Prime = NO
write-good.So = NO
proselint.Typography = NO
