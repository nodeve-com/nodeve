title: { en: Measurable, pt: Mensurável }
description:
  en: "The span a SENSOR can read this quantity over — the instrument side, not the thing's own behaviour. The one interval_kind that must be authored (a bare span is shaped like a behaviour band)."
body:
  en: >
    The INSTRUMENT side — the span a SENSOR can read this quantity over (VIM 4.7 measuring interval / ssn-system MeasurementRange), NOT the thing's own behaviour (`behavioural`). Not derivable from bounds (a bare min/max measurable is shaped like a behaviour band), so it is the ONE `interval_kind` that must be AUTHORED — omit it and the interval derives `behavioural`. Only a measurable interval may carry the instrument-only fields (resolution, max_permissible_error, channel); a behavioural band may not. The `rating`/`zone`/`value` axes belong to a behavioural band, not here.
refs:
  - { registry_id: vim, term: '4.7', match: close }
  - { registry_id: ssn_system, term: MeasurementRange, match: exact }
