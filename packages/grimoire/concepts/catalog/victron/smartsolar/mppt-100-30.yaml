body:
  en: >
    Victron SmartSolar MPPT 100/30 — one catalog entry: its identity (the `charge_controller` archetype, inherited from ./_defaults.yaml) AND how it's read (its full VE.Direct field list). `manufacturer` is inherited from ../_defaults.yaml; everything about DECODE lives here on the one product — no brand cascade merges into it.
    
    
    The reported product id is 0xA07D (captured live, serial HQ2241V4RXC) — per Victron's PID list, the SmartSolar MPPT 100/30 rev2; a driver may use the PID field to verify a stream's identity. Single MPP tracker. `pv_*` link to the `pv_tracker` MPPT-input (ordinal 1); `battery_*` to the `battery` DC-output port; CS/MPPT/ERR codes stay integers, left undecoded. H19–H23 yields are 0.01 kWh counters. Each row's `key` is the VE.Direct wire label; LINKED rows carry an `interval_item` pointer, unlinked (discovery) rows carry none (name in a comment).
product:
  model: SmartSolar MPPT 100/30

pv_tracker:
  concept_settings:
    count: 1 # single MPPT input

vedirect_fields:
  # LINKED rows carry an `interval_item` pointer; UNLINKED (discovery) rows have none — the value
  # name rides a comment until its feature lands (then add interval_item + drop the note).
  # --- VE.Direct common header (every VE.Direct device emits these) ---
  - { key: PID, type: hex } # product_id — Victron product id (e.g. 0xA07D)
  - { key: 'SER#', type: string } # serial — unit serial number
  - { key: FW, type: string } # firmware — firmware version
  - {
      key: V,
      interval_item: { feature_id: battery, property_id: voltage },
      scale: 0.001,
      decimals: 3,
    } # mV → V
  - {
      key: I,
      interval_item: { feature_id: battery, property_id: electric_current },
      scale: 0.001,
      decimals: 3,
    } # mA → A
  # --- SmartSolar MPPT fields ---
  - {
      key: VPV,
      interval_item: { feature_id: pv_tracker, property_id: voltage, ordinal: 1 },
      scale: 0.001,
      decimals: 3,
    } # mV → V
  - { key: PPV, interval_item: { feature_id: pv_tracker, property_id: active_power, ordinal: 1 } } # already W
  - { key: IL, scale: 0.001, decimals: 3 } # load_current — load output current, mA → A
  - { key: CS } # charge_state — operation state code (0 off, 3 bulk, 4 absorption, 5 float…)
  - { key: MPPT } # tracker_state — tracker state code (0 off, 1 limited, 2 active)
  - { key: ERR } # error_code — error code (0 = no error)
  - { key: OR, type: hex } # off_reason — off-reason bitmask
  - { key: LOAD, type: bool } # load_on — load output ON/OFF
  - { key: H19, scale: 0.01, decimals: 2 } # yield_total — total yield, 0.01 kWh
  - { key: H20, scale: 0.01, decimals: 2 } # yield_today — today's yield, 0.01 kWh
  - { key: H21 } # max_power_today — max power today, W
  - { key: H22, scale: 0.01, decimals: 2 } # yield_yesterday — yesterday's yield, 0.01 kWh
  - { key: H23 } # max_power_yesterday — max power yesterday, W
  - { key: HSDS } # day_sequence — day sequence number (0…364)

# Pinned identity — the stable reference (code = short-code minted at creation); survives re-filing/renames.
identity:
  slug: mppt_100_30
  code: 1SCV4M25
