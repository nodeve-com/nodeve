title: { en: Modbus registers, pt: Registros Modbus }
body:
  en: >
    A device's scalar Modbus register map — a LIST of register rows. Each row is
    a holding/input register read, scaled to an engineering NUMBER; the numeric
    side of decode (categorical side: modbus_decode). A register carries no
    authored key/topic — it LINKS to the measurand the projected feature tree
    offers via the shared `interval_item` pointer (measurand_link) and the MQTT
    sub-topic is DERIVED downstream: the catalog says WHAT a register reads, not
    where to publish it. The link stays a LOOSE reference —
    `interval_item.feature_id`/`property_id` are validated against the entry's
    baked feature tree at bake (guard-register-links), not draft-07. Numeric
    core (type/scale/decimals/unit) comes from numeric_decode; `decimals`
    rounding is source-side honesty (float32 IEEE-754 quantization beyond the
    meter's real resolution).
concept_settings:
  compose: [ measurand_link, numeric_decode ]
  is_array: true
feature_settings:
  prop:
    address: {} # LOWER of the two addresses for 32-bit types (see modbus_link word_order)
    value_type: {} # authored as `type`: the on-the-wire encoding (see property/modbus/value_type)
